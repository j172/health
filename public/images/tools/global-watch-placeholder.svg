<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="全球動態地球載入中的靜態示意圖">
  <title>全球動態地球（載入中示意圖）</title>
  <defs>
    <radialGradient id="ocean" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
    <clipPath id="globeClip">
      <circle cx="320" cy="200" r="150" />
    </clipPath>
  </defs>

  <rect width="640" height="400" fill="none" />

  <g clip-path="url(#globeClip)">
    <circle cx="320" cy="200" r="150" fill="url(#ocean)" />

    <!-- rough landmasses, purely decorative -->
    <g fill="#16a34a" opacity="0.85">
      <ellipse cx="250" cy="150" rx="38" ry="22" />
      <ellipse cx="300" cy="120" rx="26" ry="16" />
      <ellipse cx="380" cy="170" rx="46" ry="26" />
      <ellipse cx="420" cy="250" rx="30" ry="18" />
      <ellipse cx="260" cy="260" rx="34" ry="20" />
    </g>

    <!-- meridians -->
    <g stroke="#e0f2fe" stroke-width="1" opacity="0.35" fill="none">
      <ellipse cx="320" cy="200" rx="60" ry="150" />
      <ellipse cx="320" cy="200" rx="110" ry="150" />
      <ellipse cx="320" cy="200" rx="150" ry="150" />
    </g>
    <!-- parallels -->
    <g stroke="#e0f2fe" stroke-width="1" opacity="0.35" fill="none">
      <ellipse cx="320" cy="140" rx="148" ry="40" />
      <ellipse cx="320" cy="200" rx="150" ry="55" />
      <ellipse cx="320" cy="260" rx="148" ry="40" />
    </g>
  </g>

  <circle cx="320" cy="200" r="150" fill="none" stroke="#1e3a8a" stroke-width="2" opacity="0.4" />

  <!-- Taiwan marker -->
  <circle cx="362" cy="196" r="5" fill="#f97316" stroke="#fff" stroke-width="1.5" />
  <text x="372" y="193" font-family="sans-serif" font-size="13" fill="#1e293b">台灣</text>
</svg>
