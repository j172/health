name: Deploy prebuilt via FTPS

on:
  workflow_dispatch:

concurrency:
  group: deploy-ftps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    env:
      MYSQL_HOST: ${{ secrets.MYSQL_HOST != '' && secrets.MYSQL_HOST || '127.0.0.1' }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT != '' && secrets.MYSQL_PORT || '3306' }}
      MYSQL_USER: ${{ secrets.MYSQL_USER != '' && secrets.MYSQL_USER || 'placeholder' }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD != '' && secrets.MYSQL_PASSWORD || 'placeholder' }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE != '' && secrets.MYSQL_DATABASE || 'placeholder' }}
      MYSQL_SSL: ${{ secrets.MYSQL_SSL != '' && secrets.MYSQL_SSL || 'false' }}
      RSS_SYNC_SECRET: ${{ secrets.RSS_SYNC_SECRET != '' && secrets.RSS_SYNC_SECRET || 'placeholder' }}
      RSS_SYNC_ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET != '' && secrets.RSS_SYNC_ADMIN_SECRET || 'placeholder' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # Runs on this GHA runner (ample RAM), not the production host — see
      # ops_health_502_watchdog memory's 2026-08-21 incident: next/og's
      # ImageResponse renders via WASM, which crash-loops the production
      # process (768MB V8 heap cap). Output is plain static PNGs, packaged
      # into public/ below like any other static asset; the production
      # process itself never touches next/og.
      - name: Generate source og:image placeholders
        run: node scripts/generate-source-og-images.mjs

      - name: Package prebuilt bundle
        run: |
          test -d .next3
          tar -czf .prebuilt-next3.tgz .next3

      - name: Package public assets
        run: |
          test -d public
          tar -czf .prebuilt-public.tgz -C public .

      - name: Upload handler and prebuilt bundle to server (FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER != '' && secrets.FTP_SERVER || '103.21.221.12' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME != '' && secrets.FTP_USERNAME || 'j172@j172.tw' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY_SECRET: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY_SECRET: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_SECRET_KEY_SECRET: ${{ secrets.UNSPLASH_SECRET_KEY }}
          UNSPLASH_APPLICATION_ID_SECRET: ${{ secrets.UNSPLASH_APPLICATION_ID }}
          MYSQL_PASSWORD_SECRET: ${{ secrets.MYSQL_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MOENV_PM25_API_KEY_SECRET: ${{ secrets.MOENV_PM25_API_KEY }}
          MOENV_AQI_FORECAST_API_KEY_SECRET: ${{ secrets.MOENV_AQI_FORECAST_API_KEY }}
          # Phase 6 (MOENV news source) shipped without ever plumbing its key to
          # production, so fetchMoenvNews has thrown "MOENV_NEWS_API_KEY is not
          # configured" on every ingestion run since it landed.
          MOENV_NEWS_API_KEY_SECRET: ${{ secrets.MOENV_NEWS_API_KEY }}
          MOENV_GP_API_KEY_SECRET: ${{ secrets.MOENV_GP_API_KEY }}
          # Delivered to the host .env like every other credential. Previously it
          # was not: the workflow used this secret only as a request header, so the
          # value the app actually validates against lived in a hand-edited .env on
          # the server and could not be rotated from here at all. That is why the
          # value leaked in scripts/geocode-all-facilities.mjs stayed live.
          RSS_SYNC_ADMIN_SECRET_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          OPS_KEY_SECRET: ${{ secrets.OPS_KEY }}
          GOOGLE_MAPS_API_KEY_SECRET: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          OPENCAGE_API_KEY_SECRET: ${{ secrets.OPENCAGE_API_KEY }}
          NTFY_TOPIC_SECRET: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          trap 'rm -f .pixabay.env' EXIT

          clean() { printf '%s' "$1" | tr -d '\r\n'; }

          FTP_SERVER_CLEAN="$(clean "$FTP_SERVER" | xargs)"
          FTP_USERNAME_CLEAN="$(clean "$FTP_USERNAME" | xargs)"
          FTP_PASSWORD_CLEAN="$(clean "$FTP_PASSWORD")"
          PEXELS_API_KEY_CLEAN="$(clean "${PEXELS_API_KEY_SECRET:-}")"
          UNSPLASH_ACCESS_KEY_CLEAN="$(clean "${UNSPLASH_ACCESS_KEY_SECRET:-}")"
          UNSPLASH_SECRET_KEY_CLEAN="$(clean "${UNSPLASH_SECRET_KEY_SECRET:-}")"
          UNSPLASH_APPLICATION_ID_CLEAN="$(clean "${UNSPLASH_APPLICATION_ID_SECRET:-}")"
          MYSQL_PASSWORD_CLEAN="$(clean "${MYSQL_PASSWORD_SECRET:-}")"
          CLOUDFLARE_ACCOUNT_ID_CLEAN="$(clean "${CLOUDFLARE_ACCOUNT_ID_SECRET:-}")"
          CLOUDFLARE_API_TOKEN_CLEAN="$(clean "${CLOUDFLARE_API_TOKEN_SECRET:-}")"
          MOENV_PM25_API_KEY_CLEAN="$(clean "${MOENV_PM25_API_KEY_SECRET:-}")"
          MOENV_NEWS_API_KEY_CLEAN="$(clean "${MOENV_NEWS_API_KEY_SECRET:-}")"
          MOENV_GP_API_KEY_CLEAN="$(clean "${MOENV_GP_API_KEY_SECRET:-}")"
          RSS_SYNC_ADMIN_SECRET_CLEAN="$(clean "${RSS_SYNC_ADMIN_SECRET_SECRET:-}")"
          MOENV_AQI_FORECAST_API_KEY_CLEAN="$(clean "${MOENV_AQI_FORECAST_API_KEY_SECRET:-}")"
          OPS_KEY_CLEAN="$(clean "${OPS_KEY_SECRET:-}")"
          GOOGLE_MAPS_API_KEY_CLEAN="$(clean "${GOOGLE_MAPS_API_KEY_SECRET:-}")"
          OPENCAGE_API_KEY_CLEAN="$(clean "${OPENCAGE_API_KEY_SECRET:-}")"
          NTFY_TOPIC_CLEAN="$(clean "${NTFY_TOPIC_SECRET:-}")"

          if [ -z "$FTP_SERVER_CLEAN" ] || [ -z "$FTP_USERNAME_CLEAN" ] || [ -z "$FTP_PASSWORD_CLEAN" ] || [ -z "$PIXABAY_API_KEY" ]; then
            echo "Missing one of required deployment values: FTP_SERVER / FTP_USERNAME / FTP_PASSWORD / PIXABAY_API_KEY"
            exit 1
          fi

          umask 077
          printf 'PIXABAY_API_KEY=%s\n' "$PIXABAY_API_KEY" > .pixabay.env
          # name:value pairs (not an associative array — iteration order over
          # those isn't guaranteed, and a stable .pixabay.env is easier to eyeball
          # when debugging a deploy). Split only on the first ":" so a value that
          # itself contains a colon is preserved intact.
          PIXABAY_ENV_ITEMS=(
            "PEXELS_API_KEY:$PEXELS_API_KEY_CLEAN"
            "UNSPLASH_ACCESS_KEY:$UNSPLASH_ACCESS_KEY_CLEAN"
            "UNSPLASH_SECRET_KEY:$UNSPLASH_SECRET_KEY_CLEAN"
            "UNSPLASH_APPLICATION_ID:$UNSPLASH_APPLICATION_ID_CLEAN"
            "MYSQL_PASSWORD:$MYSQL_PASSWORD_CLEAN"
            "CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID_CLEAN"
            "CLOUDFLARE_API_TOKEN:$CLOUDFLARE_API_TOKEN_CLEAN"
            "MOENV_PM25_API_KEY:$MOENV_PM25_API_KEY_CLEAN"
            "MOENV_AQI_FORECAST_API_KEY:$MOENV_AQI_FORECAST_API_KEY_CLEAN"
            "MOENV_NEWS_API_KEY:$MOENV_NEWS_API_KEY_CLEAN"
            "MOENV_GP_API_KEY:$MOENV_GP_API_KEY_CLEAN"
            "RSS_SYNC_ADMIN_SECRET:$RSS_SYNC_ADMIN_SECRET_CLEAN"
            "OPS_KEY:$OPS_KEY_CLEAN"
            "GOOGLE_MAPS_API_KEY:$GOOGLE_MAPS_API_KEY_CLEAN"
            "OPENCAGE_API_KEY:$OPENCAGE_API_KEY_CLEAN"
            "NTFY_TOPIC:$NTFY_TOPIC_CLEAN"
          )
          for item in "${PIXABAY_ENV_ITEMS[@]}"; do
            name="${item%%:*}"
            value="${item#*:}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> .pixabay.env
            fi
          done

          FTP_URL="ftp://${FTP_SERVER_CLEAN}:21/health_app/.prebuilt-next3.tgz"
          echo "Uploading prebuilt bundle to FTP host ${FTP_SERVER_CLEAN} as ${FTP_USERNAME_CLEAN}"

          # --insecure is deliberate and load-bearing here, not an oversight.
          # The cPanel FTPS endpoint presents a certificate for the shared hostname
          # rather than for the configured FTP host, so verification fails against any
          # trust store. --ssl-reqd still forces the control channel to be encrypted;
          # what is skipped is peer identity, not the TLS itself.
          # To remove it: export the host's real certificate and pass --cacert. Do not
          # drop the flag alone - the upload starts failing and every deploy with it.
          CURL_FTPS_OPTS=(
            --fail --show-error --ssl-reqd --ftp-pasv --insecure
            --connect-timeout 30 --retry 5 --retry-delay 3 --retry-all-errors
            --user "${FTP_USERNAME_CLEAN}:${FTP_PASSWORD_CLEAN}"
          )

          curl "${CURL_FTPS_OPTS[@]}" \
            --upload-file ".prebuilt-next3.tgz" \
            --url "$FTP_URL"

          curl "${CURL_FTPS_OPTS[@]}" \
            --upload-file ".prebuilt-public.tgz" \
            --url "ftp://${FTP_SERVER_CLEAN}:21/health_app/.prebuilt-public.tgz"

          curl "${CURL_FTPS_OPTS[@]}" \
            --upload-file ".pixabay.env" \
            --url "ftp://${FTP_SERVER_CLEAN}:21/health_app/.pixabay.env"

          curl "${CURL_FTPS_OPTS[@]}" \
            --upload-file "ecosystem.config.cjs" \
            --url "ftp://${FTP_SERVER_CLEAN}:21/health_app/ecosystem.config.cjs"

          # `next start` reads next.config.js fresh from the app root's CWD at
          # boot — it does NOT use the copy baked into .prebuilt-next3.tgz's
          # required-server-files.json. Before this, next.config.js was never
          # part of this pipeline at all, so the server just kept running
          # whatever was last hand-FTP'd (found 2026-08-21: production was
          # silently 27 days stale, missing every images/headers config
          # change since — including dangerouslyAllowSVG, which broke every
          # local SVG <Image> that isn't explicitly `unoptimized`, e.g. the
          # dark/light theme toggler icons).
          curl "${CURL_FTPS_OPTS[@]}" \
            --upload-file "next.config.js" \
            --url "ftp://${FTP_SERVER_CLEAN}:21/health_app/next.config.js"

          for HANDLER_URL in \
            "ftp://${FTP_SERVER_CLEAN}:21/index.php" \
            "ftp://${FTP_SERVER_CLEAN}:21/health.j172.tw/index.php"
          do
            curl "${CURL_FTPS_OPTS[@]}" \
              --upload-file ".remote-health-index.php" \
              --url "$HANDLER_URL"
          done

      - name: Trigger node_modules sync on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST/SSH_PRIVATE_KEY — skipping node_modules sync."
            exit 0
          fi

          # `next start` on the server runs from its own node_modules — this
          # deploy only ever ships the .next3 build OUTPUT, never node_modules
          # itself, so the server's next install can silently drift from what
          # actually built that output. Confirmed live 2026-08-02: server had
          # next@16.0.10 installed (last synced 2026-07-25) while every deploy
          # since had been building with next@16.2.12, so the runtime couldn't
          # read the newer build's client-reference-manifest and every single
          # cold start failed its health probe with "Expected
          # clientReferenceManifest to be defined. This is a bug in Next.js."
          # — not a bug in Next.js, a version-skew bug in this deploy pipeline.
          #
          # server-npm-ci.sh SKIPS npm ci when package-lock.json is unchanged and
          # next is already present/version-matched. Confirmed live 2026-08-02:
          # forcing a full npm ci on every code-only deploy got OOM SIGKILL
          # (exit 137), wiped node_modules mid-install, and 502'd health-web
          # until manual recovery. Only lockfile / next-skew changes pay for
          # a reinstall. When an install is required it still runs detached
          # (nohup + closed stdio) so a dropped SSH session can't interrupt
          # mid-rm of node_modules. Wait step polls .npm-ci-status via short
          # SSH calls.
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SCP_OPTS=(-i "$KEY_FILE" -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)

          scp "${SCP_OPTS[@]}" package.json package-lock.json scripts/server-npm-ci.sh "$SSH_USER@$SSH_HOST:/home/tw123457/health_app/"
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            'cd /home/tw123457/health_app && rm -f .npm-ci-status && chmod +x server-npm-ci.sh && (nohup bash server-npm-ci.sh > /tmp/npm-ci.log 2>&1 < /dev/null &); echo triggered'

      - name: Wait for node_modules sync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST/SSH_PRIVATE_KEY — skipping."
            exit 0
          fi

          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)

          # Skip path usually writes status 0 within a second (no install).
          # Real installs still poll via short SSH calls rather than one long session.
          for ATTEMPT in $(seq 1 90); do
            STATUS="$(ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" 'cat /home/tw123457/health_app/.npm-ci-status 2>/dev/null || echo PENDING')"

            if [ "$STATUS" = "PENDING" ]; then
              echo "node_modules sync still running on server ($ATTEMPT/90)..."
              sleep 5
              continue
            fi

            echo "node_modules sync finished with exit code: $STATUS"
            if [ "$STATUS" != "0" ]; then
              echo "npm ci failed — server-side log tail:"
              ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" 'tail -n 50 /tmp/npm-ci.log' || true
              exit 1
            fi

            ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" 'test -f /home/tw123457/health_app/node_modules/next/dist/bin/next'
            ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" 'tail -n 20 /tmp/npm-ci.log' || true
            echo "node_modules/next confirmed present."
            exit 0
          done

          echo "Timed out waiting for node_modules sync to finish (it may have been OOM-killed before writing a status file — check the server manually)."
          exit 1

      # Both of these used to talk to /__ops/* from the runner over HTTPS. That
      # path fails silently: the host's LiteSpeed bot protection answers a runner
      # with an interstitial page carrying HTTP 200, so `curl --fail` reports
      # success, the apply never starts, and the poll then spends ten minutes
      # timing out. That is how the 2026-08-22 deploy failed with every step
      # before it showing green.
      #
      # SSH is the primary path now. The same request issued *from the host* is
      # not the blocked party — the pm2 watchdog in the crontab has been doing
      # exactly this every five minutes without trouble — and the status read
      # skips HTTP altogether by tailing the log file. The HTTPS path stays as a
      # fallback for when SSH secrets are absent, so this cannot become a single
      # point of failure on the only route to production.
      - name: Trigger apply-prebuilt force
        env:
          OPS_KEY: ${{ secrets.OPS_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          OPS_KEY_CLEAN="$(printf '%s' "$OPS_KEY" | tr -d '\r\n')"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          OPS_URL="https://health.j172.tw/__ops/apply-prebuilt-force?key=$OPS_KEY_CLEAN&cb=$(date +%s)"

          if [ -n "$SSH_HOST" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            source scripts/lib/ssh-key-stage.sh
            stage_ssh_key
            echo "Triggering apply over SSH (host-originated request)."
            ssh -i "$KEY_FILE" -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes -o ConnectTimeout=20 \
              "$SSH_USER@$SSH_HOST" \
              "curl -sS --max-time 120 --insecure --resolve 'health.j172.tw:443:103.21.221.12' '$OPS_URL'" \
              | tail -20
          else
            echo "No SSH secrets — falling back to the runner's HTTPS path."
            # --resolve pins the origin IP to bypass Cloudflare; the origin then
            # serves a shared-host certificate, hence --insecure.
            RESPONSE="$(curl --fail --show-error --silent --insecure \
              --user-agent "$UA" --retry 3 --retry-delay 2 --retry-all-errors \
              --resolve "health.j172.tw:443:103.21.221.12" "$OPS_URL")"
            printf '%s\n' "$RESPONSE" | tail -20
            # An interstitial arrives as HTTP 200 with HTML, which --fail cannot
            # catch. Refuse here rather than waiting out the poll below.
            if printf '%s' "$RESPONSE" | grep -qiE '<!doctype html|being verified'; then
              echo "Apply trigger was answered with a bot-protection page, not the handler."
              exit 1
            fi
          fi

      - name: Read apply status
        env:
          OPS_KEY: ${{ secrets.OPS_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          OPS_KEY_CLEAN="$(printf '%s' "$OPS_KEY" | tr -d '\r\n')"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          USE_SSH=0
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            source scripts/lib/ssh-key-stage.sh
            stage_ssh_key
            USE_SSH=1
            echo "Reading apply status over SSH (tailing the log directly)."
          else
            echo "No SSH secrets — polling apply status over HTTPS."
          fi

          read_status() {
            if [ "$USE_SSH" = "1" ]; then
              ssh -i "$KEY_FILE" -p "${SSH_PORT:-22}" \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o BatchMode=yes -o ConnectTimeout=20 \
                "$SSH_USER@$SSH_HOST" \
                'tail -c 8000 ~/health_app/.apply-prebuilt.log 2>/dev/null || true'
            else
              curl --fail --show-error --silent --insecure \
                --user-agent "$UA" \
                --resolve "health.j172.tw:443:103.21.221.12" \
                "https://health.j172.tw/__ops/apply-prebuilt-status?key=$OPS_KEY_CLEAN&cb=$(date +%s)"
            fi
          }

          # The server-side probe budgets 60 one-second attempts, but a single
          # attempt can hang for ~20s rather than refuse outright, so its real
          # worst case runs well past 60s — 80-100s observed under host load.
          # This loop must outlast that or it reports a false failure and skips
          # every later step, including the crontab sync.
          for ATTEMPT in $(seq 1 150); do
            STATUS="$(read_status || true)"
            printf '%s\n' "$STATUS" | tail -5

            if printf '%s' "$STATUS" | grep -Fq '[DONE-FORCE-V4]'; then
              echo "Apply completed."
              exit 0
            fi

            if printf '%s' "$STATUS" | grep -Eiq '\[FAIL|FAIL-FORCE|force-fail|apply-fail'; then
              echo "apply-prebuilt status indicates failure"
              exit 1
            fi

            echo "Waiting for apply-prebuilt completion ($ATTEMPT/150)..."
            sleep 4
          done

          echo "Timed out waiting for [DONE-FORCE-V4]"
          exit 1

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_ZONE_ID or CLOUDFLARE_API_TOKEN — skipping cache purge."
            exit 0
          fi

          # Placed right after "Read apply status" (which already health-probes
          # the new build via apply-prebuilt-force's own curl checks) rather
          # than at the end of the workflow — the later "Backfill missing news
          # card images" step fails on every run (pre-existing, unrelated to
          # this deploy: missing GH repo secrets), which would otherwise skip
          # every step after it, including this one, on every single deploy.
          # /news and /tools now carry short-TTL "Cache-Control: public" (see
          # next.config.js) — without this, a stale prebuilt page could sit in
          # Cloudflare's/LiteSpeed's cache for up to that TTL after a deploy.
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" | jq .

      - name: Sync scheduled-task crontab
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          OPS_KEY: ${{ secrets.OPS_KEY }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST/SSH_PRIVATE_KEY — skipping crontab sync."
            exit 0
          fi
          bash scripts/deploy-crontab.sh

      - name: Backfill missing news card images
        continue-on-error: true
        env:
          RSS_SYNC_ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$RSS_SYNC_ADMIN_SECRET" ]; then
            echo "Missing RSS_SYNC_ADMIN_SECRET"
            exit 1
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST/SSH_PRIVATE_KEY"
            exit 1
          fi

          # HawkHost disables TCP forwarding (AllowTcpForwarding no) — confirmed
          # live 2026-08-03: `ssh -L` fails with "administratively prohibited".
          # All admin API calls run as remote curl on the app host loopback.
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          ssh_admin() {
            # $1 = JSON body
            #
            # The admin secret is piped to the remote curl's stdin via `-K -`
            # (a curl config file, one directive per line) instead of being
            # embedded in the command string handed to `ssh` — this is a
            # shared cPanel host, so any argument on that command line would
            # be visible to other tenants via `ps aux` on the box for as long
            # as curl runs. `ssh host cmd` forwards local stdin to the remote
            # command by default, so this reaches curl without ever touching
            # the process argv.
            local body="$1"
            printf 'header = "x-rss-sync-admin-secret: %s"\n' "$RSS_SYNC_ADMIN_SECRET" | \
              ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
                "curl -K - -sS --max-time 180 -X POST http://127.0.0.1:3000/api/admin/news-images \
                  -H 'content-type: application/json' \
                  -d $(printf %q "$body")"
          }

          echo "=== clear Pixabay cache ==="
          ssh_admin '{"clearCache":true}' | jq .

          # External OG backfill used to run here too (runner egress + SSH
          # attach) but is now independently scheduled every 30 min — see
          # .github/workflows/news-og-backfill.yml and
          # docs/specs/news-card-image-freshness-scheduling.md — so it isn't
          # gated on deploy cadence and doesn't double-run alongside it here.

          echo "=== Pixabay backfill (remote loopback) ==="
          TOTAL_FAILED=0
          for ATTEMPT in $(seq 1 80); do
            RESPONSE="$(ssh_admin '{"limit":5}')"
            OK="$(printf '%s' "$RESPONSE" | jq -r '.ok')"
            ASSIGNED="$(printf '%s' "$RESPONSE" | jq -r '.summary.assigned // 0')"
            FAILED="$(printf '%s' "$RESPONSE" | jq -r '.summary.failed // 0')"
            REASON="$(printf '%s' "$RESPONSE" | jq -r '.summary.reason // ""')"
            echo "Card image backfill $ATTEMPT: assigned=$ASSIGNED failed=$FAILED reason=$REASON"

            test "$OK" = "true"
            # Reason text updated for the Pixabay->Pexels->Unsplash fallback chain
            # (see docs/specs/news-card-image-multi-provider-fallback.md) — was
            # "No unused Pixabay candidates are available." when this only ever
            # tried one provider.
            if [ "$ASSIGNED" = "0" ] && [ "$FAILED" != "0" ] && [ "$REASON" = "No unused candidates are available from any configured provider." ]; then
              echo "All provider pools exhausted."
              exit 0
            fi
            TOTAL_FAILED=$((TOTAL_FAILED + FAILED))
            if [ "$TOTAL_FAILED" -ge 40 ]; then
              echo "Too many card image failures ($TOTAL_FAILED) — stopping."
              exit 1
            fi
            if [ "$ASSIGNED" = "0" ] && [ "$FAILED" = "0" ]; then
              exit 0
            fi
          done

          echo "Card image backfill exceeded 80 batches; run the workflow again to continue safely."
          exit 1

      - name: Verify public news pages and JavaScript chunks
        run: |
          set -euo pipefail

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          for PAGE in news news/60; do
            curl --fail --show-error --silent --location --insecure \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              --resolve "health.j172.tw:443:103.21.221.12" \
              "https://health.j172.tw/$PAGE?verify=$(date +%s%N)" \
              --output "$TMP_DIR/${PAGE//\//-}.html"
          done

          grep -hoE 'src="/_next/static/chunks/[^"?]+\.js[^\"]*"' "$TMP_DIR"/*.html \
            | sed -E 's/^src="([^"]+)"$/\1/' \
            | sort -u > "$TMP_DIR/chunks.txt"

          test -s "$TMP_DIR/chunks.txt"

          while IFS= read -r CHUNK; do
            curl --fail --show-error --silent --location --insecure \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              --resolve "health.j172.tw:443:103.21.221.12" \
              --dump-header "$TMP_DIR/headers.txt" \
              "https://health.j172.tw$CHUNK" \
              --output "$TMP_DIR/chunk.js"

            grep -Eiq '^content-type: (application|text)/(javascript|x-javascript)' "$TMP_DIR/headers.txt"
            test "$(head -c 1 "$TMP_DIR/chunk.js")" != '<'
          done < "$TMP_DIR/chunks.txt"

          grep -hoE 'src="/images/news/(pixabay|pexels|unsplash)/[^"?]+"' "$TMP_DIR"/*.html \
            | sed -E 's/^src="([^"]+)"$/\1/' \
            | sort -u > "$TMP_DIR/card-images.txt" || true

          test -s "$TMP_DIR/card-images.txt"

          while IFS= read -r IMAGE; do
            curl --fail --show-error --silent --location --insecure \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              --resolve "health.j172.tw:443:103.21.221.12" \
              --dump-header "$TMP_DIR/image-headers.txt" \
              "https://health.j172.tw$IMAGE" \
              --output "$TMP_DIR/card-image"
            grep -Eiq '^content-type: image/(jpeg|png|webp)' "$TMP_DIR/image-headers.txt"
            test -s "$TMP_DIR/card-image"
          done < "$TMP_DIR/card-images.txt"
