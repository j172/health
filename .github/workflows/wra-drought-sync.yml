name: WRA drought sync

# Phase 5 (docs/specs/phase5-wra-drought-alerts.md) runs here rather than in the
# app's own cron, because opendata.wra.gov.tw answers the production host with an
# F5 Shape JavaScript challenge instead of JSON. A GitHub runner gets 200 from
# the same URL — measured via egress-probe.yml — so the fetch happens here and
# the rows are posted to the app.

on:
  workflow_dispatch:
  schedule:
    # Daily. The bulletin does not update hourly, and listActiveWeatherWarnings
    # gives 'wra' a 48h window precisely so one missed run cannot flap the widget.
    - cron: "10 23 * * *" # 07:10 Taipei

concurrency:
  group: wra-drought-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: FTP_SERVER
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # The fetch has to happen here — WRA's bot wall blocks the host — but the
      # POST cannot go to the public hostname either: Cloudflare answers a GitHub
      # runner with a "Just a moment..." challenge (HTTP 403), measured live. Same
      # reason news-og-backfill.yml talks to the app over an SSH loopback.
      - name: Fetch WRA bulletins and post them over the SSH loopback
        env:
          RSS_SYNC_ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$RSS_SYNC_ADMIN_SECRET" ]; then
            echo "Missing RSS_SYNC_ADMIN_SECRET"
            exit 1
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST/SSH_PRIVATE_KEY"
            exit 1
          fi

          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SSH_KEY_FILE="$KEY_FILE" \
            SSH_HOST="$SSH_HOST" \
            SSH_PORT="$SSH_PORT" \
            SSH_USER="$SSH_USER" \
            RSS_SYNC_ADMIN_SECRET="$RSS_SYNC_ADMIN_SECRET" \
            node scripts/gha-wra-drought-sync.mjs
