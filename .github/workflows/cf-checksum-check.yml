name: CF token checksum check (temporary diagnostic)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checksum the secret as GH Actions sees it
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf '%s' "$T" > /tmp/t.txt
          echo "runner length: $(wc -c < /tmp/t.txt)"
          echo "runner md5: $(md5sum /tmp/t.txt | awk '{print toupper($1)}')"
          rm -f /tmp/t.txt
      - name: Verify against Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/user/tokens/verify"
