name: Test network reachability (temporary)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test ltcpap.mohw.gov.tw reachability
        run: |
          echo "ltc.csv:"
          curl -s -o /dev/null -w "%{http_code} (%{time_total}s)\n" --max-time 15 "https://ltcpap.mohw.gov.tw/public/csv/ltc.csv" || echo "FAILED"
          echo "hpa.csv:"
          curl -s -o /dev/null -w "%{http_code} (%{time_total}s)\n" --max-time 15 "https://ltcpap.mohw.gov.tw/public/csv/hpa.csv" || echo "FAILED"
