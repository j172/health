name: TFDA health supplements import

on:
  workflow_dispatch:
  schedule:
    # TFDA's own data.gov.tw/dataset/6951 listing states this dataset
    # updates every 3 months, i.e. more often than the six-monthly-sync.yml
    # cadence this used to depend on (Jan 1 / Jul 1) — see #252 and
    # docs/specs/scheduling-health-audit-20260914.md. Runs quarterly on the
    # 15th (Jan/Apr/Jul/Oct) at 05:17 UTC:
    #  - Day 15, not day 1, so it never lands on six-monthly-sync.yml's own
    #    Jan 1 / Jul 1 schedule ("0 19 1 1,7 *") — that workflow also runs
    #    this same import, and upsertHealthSupplements() is idempotent
    #    (upsert keyed on licenseNo), so an accidental double-run wouldn't
    #    corrupt data, but there's no reason to invite a same-day double
    #    import anyway.
    #  - :17 past the hour, off the common :00/:30/:45 grid points other
    #    workflows in the host-tw123457-server concurrency group use
    #    (facilities-geocode-batch.yml's "*/30", news-og-backfill.yml's
    #    "7,37", npo-organizations-sync.yml's "45 3,15") — this workflow only
    #    fires 4 days a year so collision odds are already low, but keeping
    #    it off those grid points costs nothing.
    - cron: "17 5 15 1,4,7,10 *"

# This step also lives inside six-monthly-sync.yml (cron: Jan 1 / Jul 1), but
# that workflow was only added 2026-07-29 -- after this half's Jan 1/Jul 1
# window had already passed -- so tfda_health_supplements has never actually
# been populated in production and won't be until 2027-01-01 unless run
# manually. This standalone workflow lets it be re-run on demand without
# re-triggering six-monthly-sync's much heavier food-nutrition (~227k rows)
# and food-operators (~825k rows) imports. See
# scripts/import-tfda-health-supplements.mjs for details.
#
# Update 2026-09-14 (#252): this workflow now also carries its own quarterly
# `schedule:` above, since TFDA updates this dataset every 3 months — waiting
# for six-monthly-sync.yml's Jan/Jul cadence meant production trailed the
# source by up to 3 months. six-monthly-sync.yml's Jan 1 / Jul 1 run still
# also imports this dataset as before (unchanged, not touched here); the two
# schedules are intentionally offset (day 1 vs day 15) so they don't land on
# the same day.
concurrency:
  group: host-tw123457-server
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stage SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          KEY_FILE="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

      # HawkHost disables TCP forwarding (AllowTcpForwarding no), so an
      # `ssh -L` tunnel fails with "administratively prohibited" (confirmed
      # live 2026-08-03 in news-og-backfill.yml, and again 2026-09-08 on this
      # exact workflow). Runs curl on the app host against its own loopback
      # instead -- see scripts/lib/ssh-loopback.mjs.
      - name: Import TFDA 健康食品(健字號) registry (~400-600 rows)
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          TRANSPORT: ssh
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY_FILE: ${{ runner.temp }}/deploy_key
        run: node scripts/import-tfda-health-supplements.mjs

      - name: Clean up SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
