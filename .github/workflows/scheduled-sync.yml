name: Scheduled sync (RSS / AQI / CWA / earthquakes)

# Cron-based guarantee for the 30-minute cadence of every source that's
# supposed to refresh that often. The visit-driven throttle in
# .remote-health-index.php (fires opportunistically on page views, at most
# every 1800s) only covers RSS and only runs when someone happens to visit
# the site, so it can't guarantee a cadence during low-traffic windows —
# this workflow is the real clock for RSS, and the only clock at all for
# AQI/CWA/earthquakes, which previously had no automated trigger anywhere
# (their sync endpoints existed but nothing ever called them).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # RSS_SYNC_SECRET / RSS_SYNC_ADMIN_SECRET live in the FTP_SERVER
    # environment's secret store (same one deploy-ftps.yml and
    # six-monthly-sync.yml use), not as repo-level secrets — without this,
    # every secrets.* reference below silently resolves to an empty string
    # instead of failing loudly at the workflow-syntax level.
    environment: FTP_SERVER
    timeout-minutes: 10
    env:
      RSS_SYNC_SECRET: ${{ secrets.RSS_SYNC_SECRET }}
      RSS_SYNC_ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
    steps:
      # No `--fail`: a non-2xx or non-JSON response should be visible in the
      # log (HTTP status + raw body) rather than curl silently swallowing it
      # and jq dying on an empty/HTML body with an opaque parse error.
      # GitHub-hosted runners have flaky DNS resolution for health.j172.tw's
      # host, same issue worked around the same way in deploy-ftps.yml.
      - name: Trigger RSS sync
        run: |
          set -euo pipefail
          if [ -z "$RSS_SYNC_ADMIN_SECRET" ]; then
            echo "Missing RSS_SYNC_ADMIN_SECRET"
            exit 1
          fi
          HTTP_STATUS="$(curl --show-error --silent --insecure \
            --resolve "health.j172.tw:443:103.21.221.12" \
            --request POST \
            --header "x-rss-sync-admin-secret: $RSS_SYNC_ADMIN_SECRET" \
            --header "content-type: application/json" \
            --max-time 240 \
            --output /tmp/rss-sync-response.json \
            --write-out "%{http_code}" \
            "https://health.j172.tw/api/admin/rss-sync")"
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/rss-sync-response.json
          echo
          jq . /tmp/rss-sync-response.json >/dev/null
          test "$HTTP_STATUS" -ge 200 -a "$HTTP_STATUS" -lt 300

      # `if: always()` on every step below so one source failing doesn't skip
      # the rest — each sync is independent, and a stuck AQI upstream
      # shouldn't stop CWA/earthquakes from refreshing.
      - name: Trigger AQI sync
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$RSS_SYNC_SECRET" ]; then
            echo "Missing RSS_SYNC_SECRET"
            exit 1
          fi
          HTTP_STATUS="$(curl --show-error --silent --insecure \
            --resolve "health.j172.tw:443:103.21.221.12" \
            --header "x-rss-sync-secret: $RSS_SYNC_SECRET" \
            --max-time 120 \
            --output /tmp/aqi-sync-response.json \
            --write-out "%{http_code}" \
            "https://health.j172.tw/api/internal/aqi-sync")"
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/aqi-sync-response.json
          echo
          jq . /tmp/aqi-sync-response.json >/dev/null
          test "$HTTP_STATUS" -ge 200 -a "$HTTP_STATUS" -lt 300

      - name: Trigger CWA sync
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$RSS_SYNC_ADMIN_SECRET" ]; then
            echo "Missing RSS_SYNC_ADMIN_SECRET"
            exit 1
          fi
          HTTP_STATUS="$(curl --show-error --silent --insecure \
            --resolve "health.j172.tw:443:103.21.221.12" \
            --request POST \
            --header "x-rss-sync-admin-secret: $RSS_SYNC_ADMIN_SECRET" \
            --header "content-type: application/json" \
            --max-time 240 \
            --output /tmp/cwa-sync-response.json \
            --write-out "%{http_code}" \
            "https://health.j172.tw/api/admin/cwa-sync")"
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/cwa-sync-response.json
          echo
          jq . /tmp/cwa-sync-response.json >/dev/null
          test "$HTTP_STATUS" -ge 200 -a "$HTTP_STATUS" -lt 300

      - name: Trigger earthquakes sync
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$RSS_SYNC_ADMIN_SECRET" ]; then
            echo "Missing RSS_SYNC_ADMIN_SECRET"
            exit 1
          fi
          HTTP_STATUS="$(curl --show-error --silent --insecure \
            --resolve "health.j172.tw:443:103.21.221.12" \
            --request POST \
            --header "x-rss-sync-admin-secret: $RSS_SYNC_ADMIN_SECRET" \
            --header "content-type: application/json" \
            --max-time 120 \
            --output /tmp/earthquakes-sync-response.json \
            --write-out "%{http_code}" \
            "https://health.j172.tw/api/admin/earthquakes-sync")"
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/earthquakes-sync-response.json
          echo
          jq . /tmp/earthquakes-sync-response.json >/dev/null
          test "$HTTP_STATUS" -ge 200 -a "$HTTP_STATUS" -lt 300
