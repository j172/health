name: DEBUG - find crash that preceded latest restart (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inspect logs and apply-prebuilt history via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key
          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          echo "==== last 3 modified health-web error logs, newest first, with mtimes ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "ls -t --time-style=full-iso ~/.pm2/logs/health-web-error-*.log 2>/dev/null | head -3 | xargs -I{} sh -c 'echo ===={}====; stat -c \"%y\" {}'"

          echo
          echo "==== second-most-recent error log (the one BEFORE the current fresh restart), last 80 lines ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "SECOND=\$(ls -t ~/.pm2/logs/health-web-error-*.log 2>/dev/null | sed -n 2p); echo \"file: \$SECOND\"; tail -n 80 \"\$SECOND\" 2>&1"

          echo
          echo "==== apply-prebuilt.log, last 100 lines (shows watchdog-triggered restarts) ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "tail -n 100 ~/health_app/.apply-prebuilt.log 2>&1 || true"

          echo
          echo "==== watchdog cron log, last 40 lines ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "tail -n 40 ~/health_app/.rebuild-homepage.log 2>&1 || echo 'no rebuild-homepage.log'; find ~/health_app -maxdepth 1 -iname '*watchdog*' -o -iname '*.log' 2>&1"
