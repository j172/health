name: DEBUG - analyze memory-monitor.log data (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pull memory-monitor.log and crash history
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key
          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" '
            echo "==== pm2 jlist: health-web ===="
            pm2 jlist 2>/dev/null | node -e "const d=JSON.parse(require(\"fs\").readFileSync(0,\"utf8\"));for(const p of d){if(p.name===\"health-web\"){console.log(JSON.stringify({pid:p.pid,restarts:p.pm2_env.restart_time,status:p.pm2_env.status,uptime_s:Math.round((Date.now()-p.pm2_env.pm_uptime)/1000)},null,2))}}"

            echo
            echo "==== memory-monitor.log total line count ===="
            wc -l ~/health_app/logs/memory-monitor.log 2>&1 || echo "not found"

            echo
            echo "==== full memory-monitor.log content ===="
            cat ~/health_app/logs/memory-monitor.log 2>&1 || echo "not found"

            echo
            echo "==== health-web-error logs modified in the last 2 hours ===="
            find ~/.pm2/logs/ -name "health-web-error-*.log" -mmin -120 -printf "%T@ %p\n" 2>/dev/null | sort -n

            echo
            echo "==== newest error log tail (last 60 lines) ===="
            NEWEST=$(ls -t ~/.pm2/logs/health-web-error-*.log 2>/dev/null | head -1)
            tail -n 60 "$NEWEST" 2>&1
          '
