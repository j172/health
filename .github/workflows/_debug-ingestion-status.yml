name: DEBUG - health-web crash log (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read health-web error/out logs via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          echo "==== pm2 error log (last 200 lines) ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "tail -n 200 ~/.pm2/logs/health-web-error-*.log 2>&1 || true"

          echo
          echo "==== pm2 out log (last 100 lines) ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "tail -n 100 ~/.pm2/logs/health-web-out-*.log 2>&1 || true"

          echo
          echo "==== apply-prebuilt.log (last 150 lines, shows delete+start cycles) ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "tail -n 150 ~/health_app/.apply-prebuilt.log 2>&1 || true"

          echo
          echo "==== pm2.pid list ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "cat ~/.pm2/pm2.pid 2>&1 || true; ls -la ~/.pm2/pids/ 2>&1 || true"
