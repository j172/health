name: DEBUG - check sharp native binary (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check sharp native binding via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key
          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          echo "==== sharp node_modules subtree ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "find ~/health_app/node_modules -maxdepth 1 -iname '*sharp*' -o -iname '@img' 2>&1"

          echo
          echo "==== @img/sharp-* platform packages (the actual native binaries) ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "ls ~/health_app/node_modules/@img/ 2>&1 || echo '@img directory missing entirely'"

          echo
          echo "==== try requiring sharp directly ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "cd ~/health_app && /home/tw123457/.nvm/versions/node/v20.20.2/bin/node -e \"try { const s = require('sharp'); console.log('sharp loaded OK, version', s.versions); } catch(e) { console.log('sharp require FAILED:', e.message); }\""

          echo
          echo "==== npm config: ignore-scripts / .npmrc on server ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "cat ~/health_app/.npmrc 2>&1 || echo 'no .npmrc'; cat ~/.npmrc 2>&1 || echo 'no user .npmrc'"
