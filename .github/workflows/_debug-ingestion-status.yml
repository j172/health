name: DEBUG - Ingestion Runs Status (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check process list via SSH
        env:
          OPS_KEY: ${{ secrets.OPS_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          echo "==== ps -o pid,ppid,etimes,cmd for this account's node/php processes ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "ps -U \$(whoami) -o pid,ppid,etimes,cmd --sort=-etimes 2>/dev/null | grep -E 'node|lsphp|next-server' | grep -v grep"
