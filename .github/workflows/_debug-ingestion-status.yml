name: DEBUG - live-test Cloudflare Workers AI token from prod (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test the deployed CLOUDFLARE_API_TOKEN against Workers AI
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key
          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          echo "==== which .env file(s) actually have CLOUDFLARE_ACCOUNT_ID/CLOUDFLARE_API_TOKEN set (names only, no values) ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "cd ~/health_app && for f in .env .pixabay.env; do if [ -f \"\$f\" ]; then echo \"\$f: \$(grep -c '^CLOUDFLARE_ACCOUNT_ID=' \"\$f\" 2>/dev/null || echo 0) account_id line(s), \$(grep -c '^CLOUDFLARE_API_TOKEN=' \"\$f\" 2>/dev/null || echo 0) api_token line(s), mtime=\$(stat -c '%y' \"\$f\")\"; else echo \"\$f: missing\"; fi; done"

          echo
          echo "==== live curl test against Workers AI using the server's own env, from the server itself ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" '
            cd ~/health_app
            set -a
            [ -f .env ] && source .env
            [ -f .pixabay.env ] && source .pixabay.env
            set +a
            if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
              echo "CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN not set after sourcing env files"
              exit 0
            fi
            echo "account id prefix: ${CLOUDFLARE_ACCOUNT_ID:0:6}... (len=${#CLOUDFLARE_ACCOUNT_ID})"
            echo "api token prefix: ${CLOUDFLARE_API_TOKEN:0:6}... (len=${#CLOUDFLARE_API_TOKEN})"
            echo "--- verify-token endpoint (confirms the token itself, independent of any specific permission) ---"
            curl -sS --request GET \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            echo
            echo "--- workers ai run endpoint (the actual call that has been failing) ---"
            curl -sS --request POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/meta/llama-3.1-8b-instruct" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"messages\":[{\"role\":\"user\",\"content\":\"say ok\"}]}"
            echo
          '
