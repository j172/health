name: DEBUG - investigate recurring full outage (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Full diagnostics via SSH
        env:
          OPS_KEY: ${{ secrets.OPS_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key
          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          echo "==== pm2 describe health-web ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "cd ~/health_app && /home/tw123457/.nvm/versions/node/v20.20.2/bin/node /home/tw123457/.nvm/versions/node/v20.20.2/lib/node_modules/pm2/bin/pm2 describe health-web 2>&1 | grep -E 'status|restarts|created at'"

          echo
          echo "==== any 0-byte files back in image cache? ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "find ~/health_app -path '*cache/images*' -type f -size 0 2>/dev/null | wc -l"

          echo
          echo "==== current process memory (RSS) ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "ps -U \$(whoami) -o pid,rss,etimes,cmd 2>/dev/null | grep -E 'next-server|PID' | grep -v grep"

          echo
          echo "==== most recently modified error log, mtime + last 50 lines ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "LATEST=\$(ls -t ~/.pm2/logs/health-web-error-*.log 2>/dev/null | head -1); echo \"file: \$LATEST\"; echo \"mtime: \$(stat -c '%y' \"\$LATEST\" 2>/dev/null)\"; echo \"now: \$(date -u)\"; tail -n 50 \"\$LATEST\" 2>&1"
