name: DEBUG - verify post-deploy health (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify deploy landed and check for new crashes
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key
          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          echo "==== confirm the deployed source contains the circuit-breaker fix ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "grep -n 'quotaExceededOnUtcDay' ~/health_app/lib/server/cloudflare/aiClient.js 2>&1 || grep -rn 'quotaExceededOnUtcDay' ~/health_app/.next/server/ 2>&1 | head -5 || echo 'NOT FOUND (bundled/minified — trying grep across .next)'"

          echo
          echo "==== pm2 describe health-web: restarts / created at / uptime ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "pm2 jlist 2>/dev/null | node -e 'const d=JSON.parse(require(\"fs\").readFileSync(0,\"utf8\"));for(const p of d){if(p.name===\"health-web\"){console.log(JSON.stringify({pid:p.pid,restarts:p.pm2_env.restart_time,status:p.pm2_env.status,created:new Date(p.pm2_env.created_at).toISOString(),uptime_s:Math.round((Date.now()-p.pm2_env.pm_uptime)/1000)},null,2))}}' || echo 'pm2 jlist failed'"

          echo
          echo "==== god daemon count (should be 1) ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "ps -eo pid,cmd | grep -i 'God Daemon' | grep -v grep || echo 'none found'"

          echo
          echo "==== newest health-web-error log mtime (should predate this deploy if no new crash yet) ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "ls -t --time-style=full-iso ~/.pm2/logs/health-web-error-*.log 2>/dev/null | head -1 | xargs -I{} stat -c '%y  {}' {} || echo 'no error logs'"

          echo
          echo "==== live HTTP check via Cloudflare origin IP pin ===="
          curl -sS --insecure --resolve 'health.j172.tw:443:103.21.221.12' -o /dev/null -w 'status=%{http_code} time=%{time_total}s\n' 'https://health.j172.tw/' || echo 'curl failed'
