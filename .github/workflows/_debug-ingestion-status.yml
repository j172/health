name: DEBUG - check for ongoing crash loop after ensureSchema fix (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check recent crash history
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key
          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" '
            echo "==== pm2 jlist: health-web ===="
            pm2 jlist 2>/dev/null | node -e "const d=JSON.parse(require(\"fs\").readFileSync(0,\"utf8\"));for(const p of d){if(p.name===\"health-web\"){console.log(JSON.stringify({pid:p.pid,restarts:p.pm2_env.restart_time,status:p.pm2_env.status,uptime_s:Math.round((Date.now()-p.pm2_env.pm_uptime)/1000)},null,2))}}"

            echo
            echo "==== last 5 modified health-web error logs, mtimes ===="
            ls -t --time-style=full-iso ~/.pm2/logs/health-web-error-*.log 2>/dev/null | head -5 | xargs -I{} sh -c "echo ===={}====; stat -c \"%y\" {}"

            echo
            echo "==== newest error log tail (last 40 lines) ===="
            NEWEST=$(ls -t ~/.pm2/logs/health-web-error-*.log 2>/dev/null | head -1)
            tail -n 40 "$NEWEST" 2>&1

            echo
            echo "==== apply-prebuilt.log tail (recent force-apply history) ===="
            tail -n 60 ~/health_app/.apply-prebuilt.log 2>&1 || true

            echo
            echo "==== current time on server ===="
            date -u
          '
