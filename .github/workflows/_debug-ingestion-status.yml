name: DEBUG - check new error log content and reap duplicate daemon (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inspect new error log and clean up duplicate daemon
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          OPS_KEY: ${{ secrets.OPS_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key
          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          echo "==== health-web-error-4.log: full content (should be empty/tiny if just touched on start, not a real crash) ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "wc -l ~/.pm2/logs/health-web-error-4.log; echo ---; cat ~/.pm2/logs/health-web-error-4.log"

          echo
          echo "==== dry-run reap-stragglers (read-only) ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "curl -sS --insecure --resolve 'health.j172.tw:443:103.21.221.12' \"https://health.j172.tw/__ops/reap-stragglers?key=$OPS_KEY\""

          echo
          echo "==== apply reap-stragglers (kills any daemon with no live app underneath) ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "curl -sS --insecure --resolve 'health.j172.tw:443:103.21.221.12' \"https://health.j172.tw/__ops/reap-stragglers?key=$OPS_KEY&apply=1\""

          echo
          echo "==== god daemon count after reap ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "ps -eo pid,cmd | grep -i 'God Daemon' | grep -v grep || echo 'none found'"

          echo
          echo "==== pm2 describe health-web after reap ===="
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "pm2 jlist 2>/dev/null | node -e 'const d=JSON.parse(require(\"fs\").readFileSync(0,\"utf8\"));for(const p of d){if(p.name===\"health-web\"){console.log(JSON.stringify({pid:p.pid,restarts:p.pm2_env.restart_time,status:p.pm2_env.status},null,2))}}'"
