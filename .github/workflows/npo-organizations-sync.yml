name: NPO organizations sync

on:
  workflow_dispatch:
    inputs:
      start_page:
        description: "Starting page number on NPO Center (1-457)"
        required: false
        default: "1"
      rounds:
        description: "Number of rounds to fetch (each round is 2 pages)"
        required: false
        default: "5"
  schedule:
    # Runs twice daily at 03:45 and 15:45 UTC to continuously backfill NPO
    # addresses & websites.
    #
    # Issue #249: this used to fire at :30 — the same half-hour grid point as
    # facilities-geocode-batch.yml's "*/30 * * * *". Both workflows share the
    # host-tw123457-server concurrency group, and that workflow's
    # cancel-in-progress: true cancels *whatever else* holds the group, not
    # just its own prior run. Landing on the same tick meant every single
    # npo-sync run got cancelled ~34s after starting, every time, silently
    # (conclusion "cancelled", not "failure", so nothing alerted on it) —
    # NPO address/website backfill was effectively stalled indefinitely.
    # Shifting to :45 puts a 15-minute buffer on both sides of the :00/:30
    # grid, comfortably longer than an npo-sync run's typical few-minute
    # duration, without touching the shared group itself (see the group
    # comment below for why it must stay shared).
    #
    # 2026-09-20 (#336, docs/specs/github-actions-cron-decollision.md): :45
    # was originally chosen only against facilities-geocode-batch.yml's
    # :00/:30 grid and happened to land just 3 minutes from
    # rss-sync-manual.yml's old :48 mark — an accidental near-collision that
    # was never checked. No change needed here now: rss-sync-manual.yml
    # moved to :20/:50 and news-og-backfill.yml to :10/:40, so :45 is now
    # the exact midpoint between news-og-backfill's :40 and rss-sync-manual's
    # :50 (5-minute buffer each side — the max spacing available for a 7th
    # mark once those three every-30-minute workflows already tile the hour
    # at their own max spacing).
    - cron: "45 3,15 * * *"

concurrency:
  # Shared with facilities-geocode-batch.yml, disaster-points-sync.yml,
  # health-supplements-import.yml and deploy-ftps.yml on purpose: this group
  # exists so only one job at a time is hitting the production host's admin
  # API / DB connection pool over SSH loopback, per the 2026-08-23 NPROC/LVE
  # Entry Process exhaustion incident. npo-sync and facilities-geocode-batch
  # both call the same running Next.js process's admin routes (127.0.0.1:3000)
  # against the same production MySQL pool, each via its own SSH-spawned curl
  # process on the host — genuine resource contention, not just a scheduling
  # coincidence — so this workflow intentionally keeps sharing the group
  # rather than getting its own (see issue #249's investigation). Only the
  # cron time changed above; cancel-in-progress here stays false as before —
  # npo-sync itself doesn't need self-cancellation, and the other workflows'
  # own cancel-in-progress settings are untouched.
  group: host-tw123457-server
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run NPO Sync (SSH loopback)
        env:
          RSS_SYNC_ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          NPO_START_PAGE: ${{ github.event.inputs.start_page || '1' }}
          NPO_ROUNDS: ${{ github.event.inputs.rounds || '5' }}
        run: |
          set -euo pipefail

          if [ -z "$RSS_SYNC_ADMIN_SECRET" ]; then
            echo "Missing RSS_SYNC_ADMIN_SECRET"
            exit 1
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST/SSH_PRIVATE_KEY"
            exit 1
          fi

          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SSH_KEY_FILE="$KEY_FILE" \
            SSH_HOST="$SSH_HOST" \
            SSH_PORT="$SSH_PORT" \
            SSH_USER="$SSH_USER" \
            RSS_SYNC_ADMIN_SECRET="$RSS_SYNC_ADMIN_SECRET" \
            node scripts/gha-npo-sync.mjs

      # healthchecks.io dead-man's-switch: pings the "npo-organizations-sync"
      # check on success. continue-on-error/timeout-minutes keep a
      # healthchecks.io-side hiccup from ever failing or hanging this job.
      - name: Ping healthchecks.io (success)
        continue-on-error: true
        timeout-minutes: 1
        env:
          HEALTHCHECKS_URL_NPO_ORGANIZATIONS_SYNC: ${{ secrets.HEALTHCHECKS_URL_NPO_ORGANIZATIONS_SYNC }}
        run: curl -fsS --retry 3 "$HEALTHCHECKS_URL_NPO_ORGANIZATIONS_SYNC"

      # Marks the same check as failed immediately, rather than waiting for
      # healthchecks.io's timeout+grace to notice the missing success ping.
      - name: Ping healthchecks.io (failure)
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        env:
          HEALTHCHECKS_URL_NPO_ORGANIZATIONS_SYNC: ${{ secrets.HEALTHCHECKS_URL_NPO_ORGANIZATIONS_SYNC }}
        run: curl -fsS --retry 3 "$HEALTHCHECKS_URL_NPO_ORGANIZATIONS_SYNC/fail"
