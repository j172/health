name: Dengue vector survey sync

on:
  workflow_dispatch:
  # Schedule paused 2026-09-19: od.cdc.gov.tw allowlists Taiwan-ISP source
  # IPs only and silently drops everything else, confirmed against this
  # runner, the production host, and Cloudflare WARP egress alike (see
  # .github/workflows/egress-probe.yml and scripts/gha-egress-probe-host.mjs).
  # No GitHub Actions runner can ever complete this fetch, so a schedule here
  # was 5/5 guaranteed failures — scripts/local-dengue-relay.mjs (run from a
  # real Taiwan-ISP machine) is the stopgap until CDC whitelists the prod
  # host's IP. Re-enable this cron if/when that changes.
  #
  # schedule:
  #   # Daily at 04:25 UTC (12:25 Taipei) — inside the deploy-safe :15-:30
  #   # window (memory: ops_ingestion_counters_and_deploy_timing.md) so a PM2
  #   # restart from a concurrent deploy doesn't kill a mid-flight sync.
  #   #
  #   # Deliberately off every existing schedule's grid point, per issue #269:
  #   #   - facilities-geocode-batch.yml fires every 30 minutes, always on the
  #   #     :00/:30 boundary.
  #   #   - npo-organizations-sync.yml fires twice daily on :45.
  #   #   - disaster-points-sync.yml (the closest sibling — same admin-API/
  #   #     SSH-loopback shape, same shared concurrency group below) already
  #   #     owns :20; this job picks :25 instead so the two never launch in the
  #   #     same minute, even though cancel-in-progress: false on the shared
  #   #     group below means a same-minute collision would only queue, not
  #   #     cancel, either run.
  #   - cron: "25 4 * * *"

concurrency:
  # Shared with facilities-geocode-batch.yml, npo-organizations-sync.yml,
  # disaster-points-sync.yml, health-supplements-import.yml and
  # deploy-ftps.yml on purpose — same reasoning as disaster-points-sync.yml's
  # group comment: this job hits the same production host's admin API /
  # MySQL connection pool over SSH loopback as the others, and the 2026-08-23
  # NPROC/LVE Entry Process exhaustion incident is why only one of these jobs
  # should ever be running against the host at a time.
  group: host-tw123457-server
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same SSH-loopback pattern as disaster-points-sync.yml — HawkHost
      # disables TCP forwarding (AllowTcpForwarding no), so the admin API
      # call runs as remote curl against the app host's own loopback rather
      # than a tunnel. The CDC CSV download happens inside the app process
      # (lib/server/dengue/ingestDengueVectorSurvey.ts), not on this runner.
      - name: Run CDC dengue vector survey sync (SSH loopback)
        env:
          RSS_SYNC_ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$RSS_SYNC_ADMIN_SECRET" ]; then
            echo "Missing RSS_SYNC_ADMIN_SECRET"
            exit 1
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST/SSH_PRIVATE_KEY"
            exit 1
          fi

          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SSH_KEY_FILE="$KEY_FILE" \
            SSH_HOST="$SSH_HOST" \
            SSH_PORT="$SSH_PORT" \
            SSH_USER="$SSH_USER" \
            RSS_SYNC_ADMIN_SECRET="$RSS_SYNC_ADMIN_SECRET" \
            node scripts/gha-dengue-vector-sync.mjs

      # healthchecks.io dead-man's-switch: pings the "dengue-vector-sync"
      # check on success. continue-on-error/timeout-minutes keep a
      # healthchecks.io-side hiccup from ever failing or hanging this job.
      - name: Ping healthchecks.io (success)
        continue-on-error: true
        timeout-minutes: 1
        env:
          HEALTHCHECKS_URL_DENGUE_VECTOR_SYNC: ${{ secrets.HEALTHCHECKS_URL_DENGUE_VECTOR_SYNC }}
        run: curl -fsS --retry 3 "$HEALTHCHECKS_URL_DENGUE_VECTOR_SYNC"

      # Marks the same check as failed immediately, rather than waiting for
      # healthchecks.io's timeout+grace to notice the missing success ping.
      - name: Ping healthchecks.io (failure)
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        env:
          HEALTHCHECKS_URL_DENGUE_VECTOR_SYNC: ${{ secrets.HEALTHCHECKS_URL_DENGUE_VECTOR_SYNC }}
        run: curl -fsS --retry 3 "$HEALTHCHECKS_URL_DENGUE_VECTOR_SYNC/fail"
