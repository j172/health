name: CF token length check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Check length
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "length=${#T}"
          echo "first_char_hex=$(printf '%s' "$T" | head -c1 | od -An -tx1)"
          echo "last_char_hex=$(printf '%s' "$T" | tail -c1 | od -An -tx1)"
