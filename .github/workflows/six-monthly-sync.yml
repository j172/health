name: Six-monthly facility/drug data sync

on:
  workflow_dispatch:
  schedule:
    # ~03:00 Taipei time on Jan 2 and Jul 2 (cron is UTC).
    - cron: "0 19 1 1,7 *"

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    # Geocoding backfill dominates the runtime (Nominatim/OpenCage are each
    # throttled to ~1 req/sec) — give it plenty of room under GitHub's
    # 360-minute hard cap rather than getting cut off mid-run.
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install script dependencies
        run: npm install adm-zip

      - name: Run six-monthly sync
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: https://health.j172.tw
        run: bash scripts/run-six-monthly-sync.sh

      - name: Import TFDA food nutrition database (~227k rows, unzipped/parsed here)
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: https://health.j172.tw
        run: node scripts/import-tfda-food-nutrition.mjs

      - name: Import TFDA food operator registry (~825k rows, unzipped/parsed here)
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: https://health.j172.tw
        run: node scripts/import-tfda-food-operators.mjs

      # NOT run here: the 4 MOHW imports that fetch from ltcpap.mohw.gov.tw /
      # opendata.mohw.gov.tw. Empirically confirmed unreachable from GitHub
      # Actions runners too (20s timeout, HTTP 000, on all three hosts tested)
      # — the IP-range block covers the whole mohw.gov.tw apex domain, not
      # just ltcpap. These four (scripts/import-mohw-facilities.mjs, import-
      # mohw-ltc-contracted.mjs, import-mohw-disability-welfare.mjs, import-
      # mohw-elder-welfare.mjs) can only be run from a residential/office
      # network by hand — see run-six-monthly-sync.sh's header comment.
