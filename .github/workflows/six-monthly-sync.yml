name: Six-monthly facility/drug data sync

on:
  workflow_dispatch:
  schedule:
    # ~03:00 Taipei time on Jan 2 and Jul 2 (cron is UTC).
    - cron: "0 19 1 1,7 *"

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    # Geocoding backfill dominates the runtime (Nominatim/OpenCage are each
    # throttled to ~1 req/sec) — give it plenty of room under GitHub's
    # 360-minute hard cap rather than getting cut off mid-run.
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install script dependencies
        run: npm install adm-zip iconv-lite

      - name: Run six-monthly sync
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: https://health.j172.tw
        run: bash scripts/run-six-monthly-sync.sh

      - name: Import TFDA food nutrition database (~227k rows, unzipped/parsed here)
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: https://health.j172.tw
        run: node scripts/import-tfda-food-nutrition.mjs

      - name: Import TFDA food operator registry (~825k rows, unzipped/parsed here)
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: https://health.j172.tw
        run: node scripts/import-tfda-food-operators.mjs

      # The four steps below fetch from ltcpap.mohw.gov.tw / opendata.mohw.gov.tw,
      # previously confirmed unreachable from the production host and (for
      # ltcpap specifically) from GitHub Actions runners too — same mohw.gov.tw
      # apex domain, suspected same IP-range block. Each uses continue-on-error
      # so a confirmed block on one doesn't stop the rest of this workflow;
      # check the run log to see which of these actually got through.
      - name: Import MOHW long-term-care + health-check facility CSVs (ltcpap.mohw.gov.tw)
        continue-on-error: true
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: https://health.j172.tw
        run: node scripts/import-mohw-facilities.mjs

      - name: Import MOHW LTC contracted-service registry (ltcpap.mohw.gov.tw, ~15k institutions)
        continue-on-error: true
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: https://health.j172.tw
        run: node scripts/import-mohw-ltc-contracted.mjs

      - name: Import MOHW disability welfare institution directory (opendata.mohw.gov.tw)
        continue-on-error: true
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: https://health.j172.tw
        run: node scripts/import-mohw-disability-welfare.mjs

      - name: Import MOHW elder welfare institution directory (opendata.mohw.gov.tw, 22 counties)
        continue-on-error: true
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: https://health.j172.tw
        run: node scripts/import-mohw-elder-welfare.mjs
