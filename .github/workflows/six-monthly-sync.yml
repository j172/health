name: Six-monthly facility/drug data sync

on:
  workflow_dispatch:
    inputs:
      type:
        description: >-
          只重跑單一資料類型，還是完整排程？all（預設）維持現有行為；
          heritage 只跑文化資產／考古遺址（不吃 geocode 額度，幾分鐘內完成）；
          facilities 只跑機構名冊（含其 geocode 回填）；drugs 只跑 TFDA 藥品／食品資料庫。
        type: choice
        default: all
        options:
          - all
          - heritage
          - facilities
          - drugs
  schedule:
    # ~03:00 Taipei time on Jan 2 and Jul 2 (cron is UTC).
    - cron: "0 19 1 1,7 *"

concurrency:
  group: six-monthly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    # Geocoding backfill dominates the runtime (Nominatim/OpenCage are each
    # throttled to ~1 req/sec) — give it plenty of room under GitHub's
    # 360-minute hard cap rather than getting cut off mid-run. A scoped
    # `type` run finishes in a fraction of this; the cap only bites `all`.
    timeout-minutes: 340
    env:
      # `github.event.inputs.type` is unset on the `schedule` trigger, so this
      # falls back to "all" there too — scheduled runs are unaffected.
      SYNC_TYPE: ${{ github.event.inputs.type || 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install script dependencies
        run: npm install adm-zip

      # Admin sync endpoints have been observed getting a JS anti-bot
      # challenge page instead of JSON when called from a GitHub Actions
      # runner IP hitting the public domain.
      # HawkHost disables TCP forwarding (AllowTcpForwarding no), so an
      # `ssh -L` tunnel fails with "administratively prohibited".
      # We start a transparent local SSH loopback bridge (scripts/lib/ssh-bridge.mjs)
      # on 127.0.0.1:18080 that multiplexes HTTP requests into remote curl calls
      # against the production host's own 127.0.0.1:3000.
      - name: Start SSH loopback bridge
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SSH_KEY_FILE="$KEY_FILE" \
          SSH_HOST="$SSH_HOST" \
          SSH_PORT="$SSH_PORT" \
          SSH_USER="$SSH_USER" \
          PORT=18080 \
          node scripts/lib/ssh-bridge.mjs &
          echo $! > "$RUNNER_TEMP/bridge.pid"

          # 1. Local liveness probe
          echo "Waiting for ssh-bridge to listen on 127.0.0.1:18080..."
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18080/healthz

          # 2. End-to-end probe verifying SSH multiplexer + remote app connectivity
          echo "Verifying end-to-end connectivity via /api/aqi..."
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null "http://127.0.0.1:18080/api/aqi"; then break; fi
            sleep 0.5
          done
          curl -fsS -o /dev/null "http://127.0.0.1:18080/api/aqi"
          echo "SSH loopback bridge ready on 127.0.0.1:18080."

      # scripts/run-six-monthly-sync.sh runs both the facilities-directory
      # sync (+ its geocode backfill) and the TFDA drug syncs in one pass —
      # it isn't internally parameterized by type. So `facilities` and
      # `drugs` both still run this whole step (still far cheaper than `all`,
      # since every step below it that this type doesn't need gets skipped);
      # only `heritage` avoids it entirely, which is what actually matters
      # here since this step (with its 5-minute wait + per-source geocode
      # loop) is where nearly all of the 340-minute budget goes.
      - name: Run six-monthly sync
        if: env.SYNC_TYPE == 'all' || env.SYNC_TYPE == 'facilities' || env.SYNC_TYPE == 'drugs'
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: http://127.0.0.1:18080
        run: bash scripts/run-six-monthly-sync.sh

      - name: Import TFDA food nutrition database (~227k rows, unzipped/parsed here)
        if: env.SYNC_TYPE == 'all' || env.SYNC_TYPE == 'drugs'
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: http://127.0.0.1:18080
        run: node scripts/import-tfda-food-nutrition.mjs

      - name: Import TFDA food operator registry (~825k rows, unzipped/parsed here)
        if: env.SYNC_TYPE == 'all' || env.SYNC_TYPE == 'drugs'
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: http://127.0.0.1:18080
        run: node scripts/import-tfda-food-operators.mjs

      - name: Import TFDA 健康食品(健字號) registry (~400-600 rows)
        if: env.SYNC_TYPE == 'all' || env.SYNC_TYPE == 'drugs'
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: http://127.0.0.1:18080
        run: node scripts/import-tfda-health-supplements.mjs

      - name: Import NFCC accessible-ATM lists (wheelchair + voice, ~150 rows)
        if: env.SYNC_TYPE == 'all' || env.SYNC_TYPE == 'facilities'
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: http://127.0.0.1:18080
        run: node scripts/import-nfcc-accessible-atm.mjs

      - name: Import MOENV green shop directory (~8.5k stores, paginated here)
        if: env.SYNC_TYPE == 'all' || env.SYNC_TYPE == 'facilities'
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: http://127.0.0.1:18080
          MOENV_GP_API_KEY: ${{ secrets.MOENV_GP_API_KEY }}
        run: node scripts/import-moenv-green-shops.mjs

      - name: Import MOHW child welfare nurseries (~200 centers)
        if: env.SYNC_TYPE == 'all' || env.SYNC_TYPE == 'facilities'
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: http://127.0.0.1:18080
        run: node scripts/import-mohw-child-welfare-nurseries.mjs

      - name: Import MOHW child welfare centers (~40 centers)
        if: env.SYNC_TYPE == 'all' || env.SYNC_TYPE == 'facilities'
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: http://127.0.0.1:18080
        run: node scripts/import-mohw-child-welfare-centers.mjs

      # Cultural events/public art — not one of the four sync types (all /
      # heritage / facilities / drugs) offered by the `type` input, so this
      # only runs on a full `all` sync, same as before this input existed.
      - name: Sync Culture Shows and Public Art
        if: env.SYNC_TYPE == 'all'
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: http://127.0.0.1:18080
        run: |
          curl -fsS -X POST "http://127.0.0.1:18080/api/admin/culture-sync?type=shows" -H "x-rss-sync-admin-secret: $ADMIN_SECRET"
          node scripts/import-public-art.mjs

      # BOCH heritage assets (issue #170) — the production host fetches both
      # source JSON documents itself inside runHeritageAssetsSync(), same as
      # `type=shows` above, so this needs no separate runner-side import
      # script the way public-art does. Covers both 古蹟／歷史建築 and
      # 考古遺址 in one call (see ingestHeritageAssets.ts) — no separate
      # "archaeological sites" step exists, so `type=heritage` on this
      # workflow's own `type` input needs just this one step.
      - name: Sync Heritage Assets (BOCH)
        if: env.SYNC_TYPE == 'all' || env.SYNC_TYPE == 'heritage'
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
        run: |
          curl -fsS -X POST "http://127.0.0.1:18080/api/admin/culture-sync?type=heritage" -H "x-rss-sync-admin-secret: $ADMIN_SECRET"

      - name: Import IDA Certified Tourism Factories (~178 factories)
        if: env.SYNC_TYPE == 'all' || env.SYNC_TYPE == 'facilities'
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: http://127.0.0.1:18080
        run: node scripts/import-ida-tourism-factories.mjs

      - name: Import MOC Physical Bookstores (~660 bookstores)
        if: env.SYNC_TYPE == 'all' || env.SYNC_TYPE == 'facilities'
        env:
          ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          HEALTH_BASE_URL: http://127.0.0.1:18080
        run: node scripts/import-moc-bookstores.mjs

      - name: Stop SSH loopback bridge
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bridge.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/bridge.pid")" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/deploy_key"

      # healthchecks.io dead-man's-switch，對應 "six-monthly-sync" check。
      # 這個 workflow 的失敗情境複雜（多個獨立 step 各自依 SYNC_TYPE 決定要不要
      # 跑、也各自可能失敗），不逐一在每個 step 後插入 ping，改用
      # if: always() + job.status 在整個 job 結束時判斷一次要 ping 成功端點還是
      # /fail 端點。continue-on-error/timeout-minutes 確保 healthchecks.io
      # 本身的問題不會讓這個 job 被誤判失敗或卡住。
      - name: Ping healthchecks.io (job status)
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          HEALTHCHECKS_URL_SIX_MONTHLY_SYNC: ${{ secrets.HEALTHCHECKS_URL_SIX_MONTHLY_SYNC }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            curl -fsS --retry 3 "$HEALTHCHECKS_URL_SIX_MONTHLY_SYNC"
          else
            curl -fsS --retry 3 "$HEALTHCHECKS_URL_SIX_MONTHLY_SYNC/fail"
          fi

      # NOT run here: the 4 MOHW imports that fetch from ltcpap.mohw.gov.tw /
      # www.opendata.mohw.gov.tw. Empirically confirmed unreachable from the
      # production host too (re-verified 2026-08-01 via direct SSH: both
      # hosts time out after 15s) — this isn't the same public-domain/WAF
      # issue the tunnel above works around, the mohw.gov.tw subdomains
      # themselves are unreachable regardless of caller. These four
      # (scripts/import-mohw-facilities.mjs, import-mohw-ltc-contracted.mjs,
      # import-mohw-disability-welfare.mjs, import-mohw-elder-welfare.mjs)
      # can only be run from a residential/office network by hand — see
      # run-six-monthly-sync.sh's header comment.
