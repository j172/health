name: Test MOHW host reachability (temporary)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Curl ltcpap.mohw.gov.tw and opendata.mohw.gov.tw
        run: |
          echo "ltcpap.mohw.gov.tw/public/csv/ltc.csv:"
          curl -s -o /dev/null -w "  HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" --max-time 20 "https://ltcpap.mohw.gov.tw/public/csv/ltc.csv" || echo "  curl failed (timeout/network error)"
          echo "ltcpap.mohw.gov.tw/publish/abc.csv:"
          curl -s -o /dev/null -w "  HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" --max-time 20 "https://ltcpap.mohw.gov.tw/publish/abc.csv" || echo "  curl failed (timeout/network error)"
          echo "opendata.mohw.gov.tw (disability welfare):"
          curl -s -o /dev/null -w "  HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" --max-time 20 "https://www.opendata.mohw.gov.tw/dataset/opendata/sfaa/12061/%E5%85%A8%E5%9C%8B%E8%BA%AB%E5%BF%83%E9%9A%9C%E7%A4%99%E7%A6%8F%E5%88%A9%E6%A9%9F%E6%A7%8B%E4%B8%80%E8%A6%BD%E8%A1%A8.csv" || echo "  curl failed (timeout/network error)"
