name: Purge Cloudflare cache

# Standalone version of deploy-ftps.yml's "Purge Cloudflare cache" step, for
# when a cache invalidation is needed without a full deploy (e.g. a stale
# edge-cached API response after removing a route — see issue #333).

on:
  workflow_dispatch:

concurrency:
  group: purge-cloudflare-cache
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN — cannot verify."
            exit 1
          fi

          # /user/tokens/verify is the purpose-built diagnostic endpoint for
          # exactly this: it answers "is this token even valid" independent
          # of any zone/permission question, and its response body contains
          # no secret material (id/status only) so it's safe to print in full
          # in a public log.
          RESPONSE="$(curl --show-error --silent \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"

          echo "$RESPONSE" | jq .

          if ! echo "$RESPONSE" | jq -e '.success == true' >/dev/null; then
            echo "Token verification failed — the token itself is invalid/inactive/wrong-account, independent of zone or permissions. Fix this in the Cloudflare dashboard before retrying."
            exit 1
          fi

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_ZONE_ID or CLOUDFLARE_API_TOKEN — cannot purge."
            exit 1
          fi

          HTTP_OUTPUT="$(curl --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --write-out "\n__HTTP_STATUS__:%{http_code}" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache")"

          HTTP_CODE="$(printf '%s\n' "$HTTP_OUTPUT" | grep '^__HTTP_STATUS__:' | cut -d':' -f2)"
          RESPONSE_BODY="$(printf '%s\n' "$HTTP_OUTPUT" | sed '/^__HTTP_STATUS__:/d')"

          if [ "$HTTP_CODE" = "200" ]; then
            printf '%s\n' "$RESPONSE_BODY" | jq .
          else
            echo "Cloudflare cache purge failed with HTTP $HTTP_CODE: $RESPONSE_BODY"
            exit 1
          fi
