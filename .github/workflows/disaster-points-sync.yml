name: Disaster points sync

on:
  workflow_dispatch:
  schedule:
    # Daily at 04:25 UTC (12:25 Taipei) — inside the deploy-safe :15-:30
    # window (see memory: ops_ingestion_counters_and_deploy_timing.md) so a
    # PM2 restart from a concurrent deploy doesn't kill a mid-flight sync.
    #
    # 2026-09-20 (#336, docs/specs/github-actions-cron-decollision.md): moved
    # from :20 to :25. Every hour, three other SSH-connecting workflows
    # (facilities-geocode-batch, news-og-backfill, rss-sync-manual) now fire
    # on an even :00/:10/:20/:30/:40/:50 grid — with :20 itself now occupied
    # by rss-sync-manual.yml, the old :20 would have been a direct
    # same-minute collision. :25 is the midpoint between the :20 and :30
    # marks (5-minute buffer each side), which is the maximum spacing
    # available for a 7th mark once those three every-30-minute workflows
    # already tile the hour at their own max spacing — still comfortably
    # inside the :15-:30 deploy-safe window above.
    - cron: "25 4 * * *"

concurrency:
  group: host-tw123457-server
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same SSH-loopback pattern as facilities-geocode-batch.yml — HawkHost
      # disables TCP forwarding (AllowTcpForwarding no), so the admin API
      # call runs as remote curl against the app host's own loopback rather
      # than a tunnel. The MOI CSV downloads themselves happen inside the
      # app process (lib/server/disaster/ingestDisasterPoints.ts), not on
      # this runner.
      - name: Run MOI disaster points sync (SSH loopback)
        env:
          RSS_SYNC_ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$RSS_SYNC_ADMIN_SECRET" ]; then
            echo "Missing RSS_SYNC_ADMIN_SECRET"
            exit 1
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST/SSH_PRIVATE_KEY"
            exit 1
          fi

          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SSH_KEY_FILE="$KEY_FILE" \
            SSH_HOST="$SSH_HOST" \
            SSH_PORT="$SSH_PORT" \
            SSH_USER="$SSH_USER" \
            RSS_SYNC_ADMIN_SECRET="$RSS_SYNC_ADMIN_SECRET" \
            node scripts/gha-disaster-points-sync.mjs

      # healthchecks.io dead-man's-switch: pings the "disaster-points-sync"
      # check on success. continue-on-error/timeout-minutes keep a
      # healthchecks.io-side hiccup from ever failing or hanging this job.
      - name: Ping healthchecks.io (success)
        continue-on-error: true
        timeout-minutes: 1
        env:
          HEALTHCHECKS_URL_DISASTER_POINTS_SYNC: ${{ secrets.HEALTHCHECKS_URL_DISASTER_POINTS_SYNC }}
        run: curl -fsS --retry 3 "$HEALTHCHECKS_URL_DISASTER_POINTS_SYNC"

      # Marks the same check as failed immediately, rather than waiting for
      # healthchecks.io's timeout+grace to notice the missing success ping.
      - name: Ping healthchecks.io (failure)
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        env:
          HEALTHCHECKS_URL_DISASTER_POINTS_SYNC: ${{ secrets.HEALTHCHECKS_URL_DISASTER_POINTS_SYNC }}
        run: curl -fsS --retry 3 "$HEALTHCHECKS_URL_DISASTER_POINTS_SYNC/fail"
