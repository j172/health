name: RSS Ingestion Sync (Scheduled & Manual)

on:
  workflow_dispatch:
  schedule:
    # Runs every 30 minutes as an external heartbeat to guarantee news ingestion
    # even if in-app node-cron experiences transient host PM2 restarts.
    #
    # 2026-09-20 (#336, docs/specs/github-actions-cron-decollision.md):
    # re-staggered from :18/:48 to :20/:50. The old offset still landed
    # within a 10-minute window of the other SSH-connecting hourly workflows
    # once GitHub Actions' 5-15 minute schedule jitter was accounted for, and
    # it also sat only 1-3 minutes from several lower-frequency SSH
    # workflows (npo-organizations-sync.yml's old :45, disaster-points-sync
    # .yml's old :20, health-supplements-import.yml's old :17) that had only
    # been staggered against facilities-geocode-batch.yml's grid, not this
    # one. New grid: facilities-geocode-batch (:00/:30, unchanged),
    # news-og-backfill (:10/:40), this workflow (:20/:50) — an even
    # 10-minute spacing, the max achievable for three every-30-minute
    # schedules in one hour. Also still offset from in-app cron (:05/:35).
    - cron: "20,50 * * * *"

concurrency:
  group: deploy-ftps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Trigger RSS sync via SSH loopback
        env:
          RSS_SYNC_ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RSS_SYNC_ADMIN_SECRET" ]; then
            echo "Missing RSS_SYNC_ADMIN_SECRET"
            exit 1
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST/SSH_PRIVATE_KEY"
            exit 1
          fi

          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          echo "Triggering /api/admin/rss-sync via remote loopback (async mode)..."
          printf 'header = "x-rss-sync-admin-secret: %s"\n' "$RSS_SYNC_ADMIN_SECRET" | \
            ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
              "curl -K - -sS --max-time 60 -X POST 'http://127.0.0.1:3000/api/admin/rss-sync?async=1'" | jq .

