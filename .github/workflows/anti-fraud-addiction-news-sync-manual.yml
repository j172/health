name: Anti-fraud / Addiction / News-topics Sync (Manual)

# Manual trigger for spec #562's admin-sync routes that each only run on a
# recurring cron/schedule once seeded, so a first run after deploy would
# otherwise have to wait for the next tick instead of being verified right
# away. Modeled directly on rss-sync-manual.yml's SSH-loopback pattern (this
# host has no AllowTcpForwarding, so a classic `ssh -L` tunnel silently
# breaks — see docs/domains memory — the Node-level loopback bridge used by
# deploy-ftps.yml is this repo's one proven way through that).
#
# Grew across the batch:
#   - #564/#567: fraud-domains-sync (176455), moda-165027-sync (165027,
#     added here since it never got its own admin route until #639),
#     police-160055-import (160055, one-time; added here for the same
#     reason — #567 shipped the script but not a route).
#   - #566/#569/#571/#572: one facilities-sync call listing every
#     addiction/smoking-cessation source added across this spec, so a
#     fresh deploy can seed all of them in one request instead of one
#     curl per source.
#   - #565: news-topics-backfill.
#   - #570: police-172159-stats-sync, fsc-11198-stats-sync.
#
# `execute_news_backfill` and `execute_160055_import` both default to
# false (dry-run) so a first run can sanity-check counts before anything
# is written — 160055 in particular is meant to run exactly once ever.
#
# 2026-10-15: firing all ~7 triggers back-to-back within 15s caused the
# facilities-sync call to fail with "curl: (56) Recv failure: Connection
# reset by peer" — this host has a documented 20-Entry-Process ceiling and
# a history of tipping over under concurrent load (see docs/domains memory)
# that 3 already-running heavy fetches (176455's ~94k rows, 165027, 160055's
# ~45k-row one-time import) plus an 11-source facilities-sync landing on top
# of them plausibly exceeded. Every trigger below now (a) has a short sleep
# before it so the previous one's fetch has started draining, (b) tolerates
# its own curl failing (`|| echo ...`) instead of `set -e` aborting every
# remaining trigger over one transient reset, and (c) the facilities-sync
# call is split into 3 smaller batches instead of one 11-source request.

on:
  workflow_dispatch:
    inputs:
      execute_news_backfill:
        description: "Actually write news-topics backfill results (unchecked = dry-run)"
        type: boolean
        default: false
      news_backfill_days:
        description: "Days of news_items to backfill topics for"
        type: string
        default: "90"
      execute_160055_import:
        description: "Actually write the 160055 one-time import (unchecked = dry-run; this source is meant to run exactly once ever)"
        type: boolean
        default: false

concurrency:
  group: deploy-ftps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Trigger fraud-domains, addiction/smoking-cessation facilities, trend-stats, and news-topics syncs via SSH loopback
        env:
          RSS_SYNC_ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EXECUTE_NEWS_BACKFILL: ${{ inputs.execute_news_backfill }}
          NEWS_BACKFILL_DAYS: ${{ inputs.news_backfill_days }}
          EXECUTE_160055_IMPORT: ${{ inputs.execute_160055_import }}
        run: |
          set -euo pipefail
          if [ -z "$RSS_SYNC_ADMIN_SECRET" ]; then
            echo "Missing RSS_SYNC_ADMIN_SECRET"
            exit 1
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST/SSH_PRIVATE_KEY"
            exit 1
          fi

          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          NEWS_EXEC="0"
          if [ "$EXECUTE_NEWS_BACKFILL" = "true" ]; then
            NEWS_EXEC="1"
          fi
          IMPORT_160055_EXEC="0"
          if [ "$EXECUTE_160055_IMPORT" = "true" ]; then
            IMPORT_160055_EXEC="1"
          fi

          trigger() {
            local label="$1" url="$2" data="${3:-}"
            echo "== Triggering $label =="
            local headers='header = "x-rss-sync-admin-secret: '"$RSS_SYNC_ADMIN_SECRET"'"'
            local curl_cmd="curl -K - -sS --max-time 60 -X POST '$url'"
            if [ -n "$data" ]; then
              headers="$headers"$'\n''header = "Content-Type: application/json"'
              curl_cmd="$curl_cmd --data '$data'"
            fi
            if ! printf '%s\n' "$headers" | ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" "$curl_cmd" 2>&1 | jq . ; then
              echo "⚠️  $label failed (see output above) — continuing with the remaining triggers."
            fi
            sleep 15
          }

          trigger "/api/admin/fraud-domains-sync (#564, 176455)" "http://127.0.0.1:3000/api/admin/fraud-domains-sync"

          trigger "/api/admin/moda-165027-sync (#567, 165027)" "http://127.0.0.1:3000/api/admin/moda-165027-sync"

          trigger "/api/admin/police-160055-import (#567, 160055, execute=$IMPORT_160055_EXEC)" \
            "http://127.0.0.1:3000/api/admin/police-160055-import?execute=$IMPORT_160055_EXEC"

          # Split into 3 smaller batches (2026-10-15: one 11-source request
          # failed under concurrent load from the 3 triggers above) rather
          # than one big facilities-sync call.
          trigger "/api/admin/facilities-sync batch 1/3 (#566/#571)" \
            "http://127.0.0.1:3000/api/admin/facilities-sync" \
            '{"sources":["addiction_treatment_133353","methadone_cross_district_133345","anti_drug_center_moj"]}'

          trigger "/api/admin/facilities-sync batch 2/3 (#569, #572 national+taipei+ntpc)" \
            "http://127.0.0.1:3000/api/admin/facilities-sync" \
            '{"sources":["hpa_smoking_cessation_6954","smoking_cessation_taipei_121898","smoking_cessation_ntpc_124244","smoking_cessation_ntpc_dental_125915"]}'

          trigger "/api/admin/facilities-sync batch 3/3 (#572 taoyuan+taichung+tainan+kaohsiung)" \
            "http://127.0.0.1:3000/api/admin/facilities-sync" \
            '{"sources":["smoking_cessation_taoyuan_33872","smoking_cessation_taichung_81720","smoking_cessation_tainan_140122","smoking_cessation_kaohsiung_87259"]}'

          trigger "/api/admin/police-172159-stats-sync (#570)" "http://127.0.0.1:3000/api/admin/police-172159-stats-sync"

          trigger "/api/admin/fsc-11198-stats-sync (#570)" "http://127.0.0.1:3000/api/admin/fsc-11198-stats-sync"

          trigger "/api/admin/news-topics-backfill (#565, execute=$NEWS_EXEC, days=$NEWS_BACKFILL_DAYS)" \
            "http://127.0.0.1:3000/api/admin/news-topics-backfill?execute=$NEWS_EXEC&days=$NEWS_BACKFILL_DAYS"

          echo "All triggers attempted (fire-and-forget 202s where successful) -- check production logs for final counts, then live-verify via the public query APIs."

      - name: TEMP debug - synchronous facilities-sync for methadone_cross_district/anti_drug_center
        env:
          RSS_SYNC_ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key
          SSH_OPTS=(-i "$KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)
          printf 'header = "x-rss-sync-admin-secret: %s"\nheader = "Content-Type: application/json"\n' "$RSS_SYNC_ADMIN_SECRET" | \
            ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
              "curl -K - -sS --max-time 60 -X POST 'http://127.0.0.1:3000/api/admin/facilities-sync?sync=1' --data '{\"sources\":[\"methadone_cross_district_133345\",\"anti_drug_center_moj\"]}'" | jq .
