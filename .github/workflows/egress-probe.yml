name: Egress probe

# Answers one question: which upstreams refuse the production host but allow a
# GitHub runner? Several Taiwanese sites 403 the shared host's IP while returning
# 200 from anywhere else, and that decides whether moving a fetch to the runner
# is worth building. Run it before assuming either way.

on:
  workflow_dispatch:

concurrency:
  group: egress-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # 10, not 5: the Track B probe step (issue #669) added 10 more curls, each
    # capped at 20s, on top of the existing ones.
    timeout-minutes: 10
    steps:
      - name: Probe upstreams from the runner
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          probe() {
            local label="$1"; shift
            local url="$1"; shift
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 -A "$UA" "$url" 2>/dev/null || echo "000")"
            printf '%-34s %s\n' "$label" "$code"
          }

          echo "=== from a GitHub Actions runner ==="
          probe "nhi.gov.tw rss (403 on host)"    "https://www.nhi.gov.tw/ch/rss-3255-1.xml"
          probe "pgw.udn.com.tw image (403)"      "https://pgw.udn.com.tw/gw/photo.php?u=/photo/t3/2026/08/10/35215805.jpg&x=0&y=0&sw=1022&sh=682&s=Y&w=1200&h=800"
          probe "mirrormedia category health"     "https://www.mirrormedia.mg/category/health"
          probe "opendata.wra.gov.tw (bot wall)"  "https://opendata.wra.gov.tw/api/v2/51ea7202-18fd-46e3-adae-4d05bc827a28?format=JSON"
          probe "mohw.gov.tw rss (control, OK)"   "https://www.mohw.gov.tw/rss-16-1.html"
          probe "opendata.mohw.gov.tw (160903)"   "https://www.opendata.mohw.gov.tw/dataset/opendata/sfaa/160903/%E5%85%A8%E5%9C%8B%E7%A4%BE%E7%A6%8F%E4%B8%AD%E5%BF%83%E9%80%9A%E8%A8%8A%E9%8C%84.csv"
          # issue #612: nhplatform.mohw.gov.tw (全國開業護理機構清冊, data.gov.tw
          # 115950) — reachable from the dev environment that built this
          # source (2026-10-14, HTTP 200, no redirect), never confirmed from
          # here or the production host.
          probe "nhplatform.mohw.gov.tw (115950)" "https://nhplatform.mohw.gov.tw/dl-3820-74883655f255416abc752bef29cbd7aa.html"

          echo
          echo "=== nhi.gov.tw header variants — is the 403 really about the IP? ==="
          NHI="https://www.nhi.gov.tw/ch/rss-3255-1.xml"

          variant() {
            local label="$1"; shift
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$@" "$NHI" 2>/dev/null || echo "000")"
            printf '%-32s %s\n' "$label" "$code"
          }

          variant "browser UA"           -A "$UA"
          variant "browser UA + lang"    -A "$UA" -H "Accept-Language: zh-TW,zh;q=0.9"
          variant "browser UA + referer" -A "$UA" -e "https://www.nhi.gov.tw/ch/"
          variant "full browser headers" -A "$UA" -H "Accept-Language: zh-TW,zh;q=0.9" -H "Accept: application/xml,text/xml,*/*" -e "https://www.nhi.gov.tw/ch/"
          variant "no UA header at all"  -H "User-Agent;"
          variant "curl default UA"
          variant "forced HTTP/1.1"      -A "$UA" --http1.1
          variant "IPv4 only"            -A "$UA" -4

          echo
          echo "200 here + 403 on the host means the host's IP is the problem and"
          echo "moving that fetch to the runner will fix it. 403 in both places means"
          echo "it will not, and something else is required."

      # issue #669 (B-0, parent: docs/2.0/track-b-opendata-phase2-3-spec.md):
      # every Track B upstream host that spec §3 marks 未驗證, each probed with
      # the exact resource the ticket that depends on it will fetch. This is
      # the runner half; probe-from-host below runs the same list from the
      # production host (scripts/gha-egress-probe-host.mjs), and
      # tests/egress-probe-track-b-669.test.mjs keeps the two in sync. Read the
      # pair together: reachable from the runner but not the host means "fetch
      # on the runner, POST back over the SSH loopback"; blocked from both
      # means neither relay helps (the nhplatform.mohw.gov.tw situation).
      # Run once after this merges, then back-fill the spec's §3 table.
      - name: "Probe Track B upstreams from the runner (issue #669)"
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          # Large files get a Range request: only the status line matters, and
          # a server that ignores Range is still cut off by --max-time.
          probe_track_b() {
            local label="$1"
            local url="$2"
            local range="${3:-}"
            local args=( -sS -o /dev/null --max-time 20 -A "$UA" -w 'http_code=%{http_code} time=%{time_total}s size=%{size_download}' )
            if [ -n "$range" ]; then args+=( -r "$range" ); fi
            local out rc=0
            out="$(curl "${args[@]}" "$url" 2>&1)" || rc=$?
            printf '%-46s exit=%s %s\n' "$label" "$rc" "$out"
          }

          echo "=== Track B upstreams from a GitHub Actions runner ==="
          # B-9: 派出所 5958 — the ZIP's file name carries a publish date, so
          # the sync resolves the current URL from the data.gov.tw API first.
          probe_track_b "data.gov.tw api 5958 (URL resolver)"     "https://data.gov.tw/api/v2/rest/dataset/5958"
          probe_track_b "www.tgos.tw 5958 ZIP (B-9)"              "https://www.tgos.tw/tgos/VirtualDir/Product/9927eb8a-efed-40c0-8bc4-83121ad6834a/1150930.zip"
          # B-16: 臺北 路線 136515 (558 KB CSV) — never probed before the first sync hung.
          probe_track_b "data.taipei 136515 routes (B-16)"        "https://data.taipei/api/dataset/6bb3304b-4f46-4bb0-8cd1-60c66dcd1cae/resource/a6e90031-7ec4-4089-afb5-361a4efe7202/download"
          # B-16 / B-17: 新北 路線 125664 (3.6 MB CSV) + 即時位置 122972.
          probe_track_b "data.ntpc.gov.tw 125664 routes (B-16)"  "https://data.ntpc.gov.tw/api/datasets/edc3ad26-8ae7-4916-a00b-bc6048d19bf8/csv/file" "0-1023"
          probe_track_b "data.ntpc.gov.tw 122972 live (B-17)"     "https://data.ntpc.gov.tw/api/datasets/28ab4122-60e1-4065-98e5-abccb69aaca6/csv/file"
          # B-18: 臺中 83558, 臺南 136310, 高雄 138256 即時位置.
          probe_track_b "newdatacenter.taichung.gov.tw 83558 (B-18)" "https://newdatacenter.taichung.gov.tw/api/v1/no-auth/resource.download?rid=c923ad20-2ec6-43b9-b3ab-54527e99f7bc"
          probe_track_b "soa.tainan.gov.tw 136310 (B-18)"         "https://soa.tainan.gov.tw/Api/Service/Get/2c8a70d5-06f2-4353-9e92-c40d33bcd969"
          probe_track_b "openapi.kcg.gov.tw 138256 (B-18)"        "https://openapi.kcg.gov.tw/Api/Service/Get/aaf4ce4b-4ca8-43de-bfaf-6dc97e89cac0"
          # opdadm.moi.gov.tw: a resource already used in production (176455)
          # as the control, then 7317 失物招領's own path (spec §8 item 1;
          # 28.9 MB, hence the range; D3 has since cancelled the 失物招領 tool,
          # so that row is informational only). A1/A2 事故 resources are not
          # probed: their URLs aren't recorded in the repo and D2 cancelled
          # the feature.
          probe_track_b "opdadm.moi.gov.tw 176455 (live control)" "https://opdadm.moi.gov.tw/api/v1/no-auth/resource/api/dataset/29E8E643-88ED-4952-B21E-BD42A3B7108C/resource/81B3145B-8134-4B01-9FAE-1D62638B4E78/download"
          probe_track_b "opdadm.moi.gov.tw 7317 (spec §8)"        "https://opdadm.moi.gov.tw/api/v1/no-auth/resource/api/dataset/E1060AE4-ACCE-4960-9EDC-EF52681B9570/resource/82770E4D-D01D-441F-9FD4-FBE1E7B086F6/download" "0-1023"
          # data.moa.gov.tw: used in production through the older
          # Service/OpenData/TransService.aspx path; the /api/v1/ path that
          # B-12 林火 will use was never probed individually.
          probe_track_b "data.moa.gov.tw ForestFireAlertWCF (B-12)"      "https://data.moa.gov.tw/api/v1/ForestFireAlertWCF/?CreateDate=2026-10-15"
          # issue #691 (今天要上班上課嗎？): www.dgpa.gov.tw has never been
          # probed from either vantage point, and BOTH halves of that tool
          # depend on it — the office-calendar CSVs that data.gov.tw 14718
          # points at are served from www.dgpa.gov.tw/FileConversion, and the
          # closure-announcement page is the link the page sends people to
          # (this site does not fetch it, but a blocked host/runner would tell
          # us whether any future automated read could work). The CSV probed is
          # the 116 (2027) file, the newest one; the data.gov.tw metadata API
          # is the resolver the sync uses to find current file URLs.
          probe_track_b "data.gov.tw api 14718 (URL resolver)"    "https://data.gov.tw/api/v2/rest/dataset/14718"
          probe_track_b "www.dgpa.gov.tw 14718 calendar CSV (#691)" "https://www.dgpa.gov.tw/FileConversion?filename=dgpa/files/202607/f538b1ff-ba60-4c63-9477-10db8e6612d1.csv&nfix=&name=116%e5%b9%b4%e4%b8%ad%e8%8f%af%e6%b0%91%e5%9c%8b%e6%94%bf%e5%ba%9c%e8%a1%8c%e6%94%bf%e6%a9%9f%e9%97%9c%e8%be%a6%e5%85%ac%e6%97%a5%e6%9b%86%e8%a1%a8_utf8bom.csv"
          probe_track_b "www.dgpa.gov.tw nds.html (closure page)"  "https://www.dgpa.gov.tw/typh/daily/nds.html"

      - name: WRA resource shapes (runner egress)
        run: |
          node -e '
          const ids = {
            "drought (already live)": "51ea7202-18fd-46e3-adae-4d05bc827a28",
            "301c0b62": "301c0b62-8736-4e03-95ef-55309c1a5e74",
            "eecf1c46": "eecf1c46-9676-43a0-936e-13b78a69213b",
            "64d907be": "64d907be-342b-4e3d-ab7e-89f7aa5d776e",
          };
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36";
          const rows = (p) => Array.isArray(p) ? p
            : (p && typeof p === "object")
              ? (p.responseData || p.data || p.records || (p.result && p.result.records) || [])
              : [];
          (async () => {
            for (const [label, id] of Object.entries(ids)) {
              const url = `https://opendata.wra.gov.tw/api/v2/${id}?sort=_importdate%20asc&format=JSON`;
              try {
                const res = await fetch(url, { headers: { "User-Agent": UA, Accept: "application/json" }, signal: AbortSignal.timeout(30000) });
                const ct = res.headers.get("content-type") || "";
                const body = await res.text();
                if (ct.includes("text/html")) { console.log(`${label}: BOT CHALLENGE even here`); continue; }
                const r = rows(JSON.parse(body));
                console.log(`\n--- ${label} --- ${r.length} rows`);
                if (r[0]) {
                  console.log("  keys:", Object.keys(r[0]).join(", "));
                  console.log("  sample:", JSON.stringify(r[0]).slice(0, 500));
                }
              } catch (e) { console.log(`${label}: ERROR ${e.message}`); }
            }
          })();
          '

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: What is inside the WRA warning map layers
        run: node scripts/probe-wra-kml.mjs

  probe-from-host:
    # Companion to the runner-side probe above: same upstreams, but curled
    # from the production host's own network over the SSH loopback, to tell
    # apart "the host's IP is blocked" from "the site itself is flaky"
    # (issue #269's sync workflow, since removed, failed on a 60s timeout
    # every run this way — see scripts/gha-egress-probe-host.mjs).
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    # 3 -> 10: the host probe now lists 18 targets, each capped at 20s by
    # curl, so a day where several hosts time out must not cancel the run
    # before it prints its report (issue #669;
    # tests/egress-probe-track-b-669.test.mjs checks this arithmetic).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Probe upstreams from the production host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key
          SSH_KEY_FILE="$KEY_FILE" \
            SSH_HOST="$SSH_HOST" \
            SSH_PORT="$SSH_PORT" \
            SSH_USER="$SSH_USER" \
            node scripts/gha-egress-probe-host.mjs
