name: Egress probe

# Answers one question: which upstreams refuse the production host but allow a
# GitHub runner? Several Taiwanese sites 403 the shared host's IP while returning
# 200 from anywhere else, and that decides whether moving a fetch to the runner
# is worth building. Run it before assuming either way.

on:
  workflow_dispatch:

concurrency:
  group: egress-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    timeout-minutes: 5
    steps:
      - name: Probe upstreams from the runner
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          probe() {
            local label="$1"; shift
            local url="$1"; shift
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 -A "$UA" "$url" 2>/dev/null || echo "000")"
            printf '%-34s %s\n' "$label" "$code"
          }

          echo "=== from a GitHub Actions runner ==="
          probe "nhi.gov.tw rss (403 on host)"    "https://www.nhi.gov.tw/ch/rss-3255-1.xml"
          probe "pgw.udn.com.tw image (403)"      "https://pgw.udn.com.tw/gw/photo.php?u=/photo/t3/2026/08/10/35215805.jpg&x=0&y=0&sw=1022&sh=682&s=Y&w=1200&h=800"
          probe "mirrormedia category health"     "https://www.mirrormedia.mg/category/health"
          probe "opendata.wra.gov.tw (bot wall)"  "https://opendata.wra.gov.tw/api/v2/51ea7202-18fd-46e3-adae-4d05bc827a28?format=JSON"
          probe "mohw.gov.tw rss (control, OK)"   "https://www.mohw.gov.tw/rss-16-1.html"

          echo
          echo "=== nhi.gov.tw header variants — is the 403 really about the IP? ==="
          NHI="https://www.nhi.gov.tw/ch/rss-3255-1.xml"

          variant() {
            local label="$1"; shift
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$@" "$NHI" 2>/dev/null || echo "000")"
            printf '%-32s %s\n' "$label" "$code"
          }

          variant "browser UA"           -A "$UA"
          variant "browser UA + lang"    -A "$UA" -H "Accept-Language: zh-TW,zh;q=0.9"
          variant "browser UA + referer" -A "$UA" -e "https://www.nhi.gov.tw/ch/"
          variant "full browser headers" -A "$UA" -H "Accept-Language: zh-TW,zh;q=0.9" -H "Accept: application/xml,text/xml,*/*" -e "https://www.nhi.gov.tw/ch/"
          variant "no UA header at all"  -H "User-Agent;"
          variant "curl default UA"
          variant "forced HTTP/1.1"      -A "$UA" --http1.1
          variant "IPv4 only"            -A "$UA" -4

          echo
          echo "200 here + 403 on the host means the host's IP is the problem and"
          echo "moving that fetch to the runner will fix it. 403 in both places means"
          echo "it will not, and something else is required."

      - name: WRA resource shapes (runner egress)
        run: |
          node -e '
          const ids = {
            "drought (already live)": "51ea7202-18fd-46e3-adae-4d05bc827a28",
            "301c0b62": "301c0b62-8736-4e03-95ef-55309c1a5e74",
            "eecf1c46": "eecf1c46-9676-43a0-936e-13b78a69213b",
            "64d907be": "64d907be-342b-4e3d-ab7e-89f7aa5d776e",
          };
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36";
          const rows = (p) => Array.isArray(p) ? p
            : (p && typeof p === "object")
              ? (p.responseData || p.data || p.records || (p.result && p.result.records) || [])
              : [];
          (async () => {
            for (const [label, id] of Object.entries(ids)) {
              const url = `https://opendata.wra.gov.tw/api/v2/${id}?sort=_importdate%20asc&format=JSON`;
              try {
                const res = await fetch(url, { headers: { "User-Agent": UA, Accept: "application/json" }, signal: AbortSignal.timeout(30000) });
                const ct = res.headers.get("content-type") || "";
                const body = await res.text();
                if (ct.includes("text/html")) { console.log(`${label}: BOT CHALLENGE even here`); continue; }
                const r = rows(JSON.parse(body));
                console.log(`\n--- ${label} --- ${r.length} rows`);
                if (r[0]) {
                  console.log("  keys:", Object.keys(r[0]).join(", "));
                  console.log("  sample:", JSON.stringify(r[0]).slice(0, 500));
                }
              } catch (e) { console.log(`${label}: ERROR ${e.message}`); }
            }
          })();
          '

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: What is inside the WRA warning map layers
        run: node scripts/probe-wra-kml.mjs

      # Issue #177 — service.taipower.com.tw timed out from the dev worktree
      # (both curl and WebFetch, 20s/60s). Confirm real field shapes for
      # d006001 (real-time generation) and d525001 (unconfirmed — guessed to
      # be scheduled-outage data) from the runner before writing any ingestion
      # code against them.
      - name: Taipower d006001 / d525001 field shapes (runner egress)
        run: |
          node -e '
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36";
          (async () => {
            for (const [label, url] of Object.entries({
              "d006001 (real-time generation, JSON)": "https://service.taipower.com.tw/data/opendata/apply/file/d006001/001.json",
              "d525001 (unconfirmed, CSV)": "https://service.taipower.com.tw/data/opendata/apply/file/d525001/001.csv",
            })) {
              try {
                const res = await fetch(url, { headers: { "User-Agent": UA }, signal: AbortSignal.timeout(30000) });
                const ct = res.headers.get("content-type") || "";
                const cd = res.headers.get("content-disposition") || "";
                const buf = Buffer.from(await res.arrayBuffer());
                console.log(`\n--- ${label} --- status=${res.status} content-type=${ct} content-disposition=${cd} bytes=${buf.length}`);
                const text = buf.toString("utf8");
                if (text.trim().startsWith("{") || text.trim().startsWith("[")) {
                  const parsed = JSON.parse(text);
                  console.log("  top-level keys:", Array.isArray(parsed) ? `array[${parsed.length}]` : Object.keys(parsed).join(", "));
                  const rows = Array.isArray(parsed) ? parsed : (parsed.records || parsed.data || Object.values(parsed).find(Array.isArray) || []);
                  console.log("  row count:", Array.isArray(rows) ? rows.length : "n/a");
                  if (Array.isArray(rows) && rows[0]) {
                    console.log("  row[0] keys:", Object.keys(rows[0]).join(", "));
                    console.log("  row[0] sample:", JSON.stringify(rows[0]).slice(0, 800));
                    console.log("  row[1] sample:", JSON.stringify(rows[1] || null).slice(0, 800));
                  }
                } else {
                  console.log("  first 2000 chars (CSV/text):");
                  console.log(text.slice(0, 2000));
                }
              } catch (e) { console.log(`${label}: ERROR ${e.message}`); }
            }
          })();
          '

      # Also checks whether the production host itself (not just the runner)
      # can reach service.taipower.com.tw — decides whether the sync job can
      # run in-process on the host (like WRA reservoir/water-level) or needs
      # to fetch on the runner and POST back over the SSH loopback (like the
      # nhi.gov.tw / UDN pattern). Read-only, no admin API calls.
      - name: Taipower reachability from the production host (SSH loopback)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "Missing SSH secrets — skipping host-side probe."
            exit 0
          fi
          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key
          ssh -i "$KEY_FILE" -p "${SSH_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "${SSH_USER}@${SSH_HOST}" \
            'for u in "https://service.taipower.com.tw/data/opendata/apply/file/d006001/001.json" "https://service.taipower.com.tw/data/opendata/apply/file/d525001/001.csv"; do
               code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$u" 2>/dev/null || echo "000")
               printf "%-70s %s\n" "$u" "$code"
             done'
