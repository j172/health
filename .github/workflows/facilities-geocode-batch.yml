name: Facilities geocode batch

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes per docs/specs/phase9-opencage-geocode-batch.md's
    # agreed policy. A run with no pending rows (or an exhausted daily
    # budget) exits quickly without making provider requests — see
    # lib/server/facilities/geocodeBatch.ts.
    - cron: "*/10 * * * *"

jobs:
  geocode:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same SSH-loopback pattern as news-og-backfill.yml — HawkHost disables
      # TCP forwarding (AllowTcpForwarding no), so admin API calls run as
      # remote curl against the app host's own loopback rather than a tunnel.
      - name: Run geocode batch (SSH loopback)
        env:
          RSS_SYNC_ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$RSS_SYNC_ADMIN_SECRET" ]; then
            echo "Missing RSS_SYNC_ADMIN_SECRET"
            exit 1
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST/SSH_PRIVATE_KEY"
            exit 1
          fi

          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SSH_KEY_FILE="$KEY_FILE" \
            SSH_HOST="$SSH_HOST" \
            SSH_PORT="$SSH_PORT" \
            SSH_USER="$SSH_USER" \
            RSS_SYNC_ADMIN_SECRET="$RSS_SYNC_ADMIN_SECRET" \
            GEOCODE_BATCH_ROUNDS=30 \
            node scripts/gha-facilities-geocode-batch.mjs
