name: Facilities geocode batch

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes (P2 resilience: lowered from 10m to prevent LVE process saturation).
    # A run with no pending rows (or an exhausted daily budget) exits quickly
    # without making provider requests — see lib/server/facilities/geocodeBatch.ts.
    - cron: "*/30 * * * *"

concurrency:
  group: host-tw123457-server
  cancel-in-progress: true

jobs:
  geocode:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same SSH-loopback pattern as news-og-backfill.yml — HawkHost disables
      # TCP forwarding (AllowTcpForwarding no), so admin API calls run as
      # remote curl against the app host's own loopback rather than a tunnel.
      - name: Run geocode batch (SSH loopback)
        env:
          RSS_SYNC_ADMIN_SECRET: ${{ secrets.RSS_SYNC_ADMIN_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$RSS_SYNC_ADMIN_SECRET" ]; then
            echo "Missing RSS_SYNC_ADMIN_SECRET"
            exit 1
          fi
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST/SSH_PRIVATE_KEY"
            exit 1
          fi

          source scripts/lib/ssh-key-stage.sh
          stage_ssh_key

          SSH_KEY_FILE="$KEY_FILE" \
            SSH_HOST="$SSH_HOST" \
            SSH_PORT="$SSH_PORT" \
            SSH_USER="$SSH_USER" \
            RSS_SYNC_ADMIN_SECRET="$RSS_SYNC_ADMIN_SECRET" \
            GEOCODE_BATCH_ROUNDS=30 \
            node scripts/gha-facilities-geocode-batch.mjs

      # healthchecks.io dead-man's-switch: pings the "facilities-geocode-batch"
      # check on success. continue-on-error/timeout-minutes keep a
      # healthchecks.io-side hiccup from ever failing or hanging this job.
      - name: Ping healthchecks.io (success)
        continue-on-error: true
        timeout-minutes: 1
        env:
          HEALTHCHECKS_URL_FACILITIES_GEOCODE_BATCH: ${{ secrets.HEALTHCHECKS_URL_FACILITIES_GEOCODE_BATCH }}
        run: curl -fsS --retry 3 "$HEALTHCHECKS_URL_FACILITIES_GEOCODE_BATCH"

      # Marks the same check as failed immediately, rather than waiting for
      # healthchecks.io's timeout+grace to notice the missing success ping.
      - name: Ping healthchecks.io (failure)
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        env:
          HEALTHCHECKS_URL_FACILITIES_GEOCODE_BATCH: ${{ secrets.HEALTHCHECKS_URL_FACILITIES_GEOCODE_BATCH }}
        run: curl -fsS --retry 3 "$HEALTHCHECKS_URL_FACILITIES_GEOCODE_BATCH/fail"
